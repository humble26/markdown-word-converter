<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Word 转换器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #7a8290;
    --primary: #2f6fed;
    --primary-hover: #1f5bd0;
    --code-bg: #f1f3f7;
    --success: #1aa06a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2f6fed, #6f4ff2);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 17px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { background: #f0f2f6; }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 14px;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn:active { transform: translateY(1px); }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 74px);
  }
  .panes { display: grid; grid-template-columns: 1fr 1fr; grid-column: 1 / -1; grid-row: 2; }
  .pane {
    padding: 12px 16px;
    background: var(--panel);
    overflow: auto;
  }
  .pane-left { border-right: 1px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 2px;
    font-size: 12px; color: var(--muted);
    font-weight: 600; letter-spacing: .3px;
  }
  .pane-head .tip { font-weight: 400; margin-left: auto; }
  textarea {
    width: 100%;
    height: calc(100% - 38px);
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: none;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.7;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    color: var(--text);
    background: #fff;
  }
  textarea:focus { outline: none; border-color: var(--primary); }
  #preview {
    height: calc(100% - 38px);
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: auto;
    font-size: 14px;
    line-height: 1.75;
    background: #fff;
  }
  #preview h1, #preview h2, #preview h3, #preview h4 {
    margin: .9em 0 .45em; line-height: 1.35; font-weight: 700;
  }
  #preview h1 { font-size: 1.55em; }
  #preview h2 { font-size: 1.35em; }
  #preview h3 { font-size: 1.18em; }
  #preview h4 { font-size: 1.05em; }
  #preview p { margin: .5em 0; }
  #preview ul, #preview ol { margin: .5em 0; padding-left: 1.6em; }
  #preview li { margin: .2em 0; }
  #preview blockquote {
    margin: .6em 0; padding: .3em .9em;
    border-left: 3px solid var(--primary);
    background: #f4f7ff; color: #4a5568; border-radius: 0 6px 6px 0;
  }
  #preview code {
    background: var(--code-bg);
    padding: .12em .4em; border-radius: 5px;
    font-family: "Consolas", monospace; font-size: .92em;
  }
  #preview pre {
    background: #0f1722; color: #e6edf7;
    padding: 12px 14px; border-radius: 8px; overflow: auto;
  }
  #preview pre code { background: none; padding: 0; color: inherit; }
  #preview table { border-collapse: collapse; margin: .7em 0; }
  #preview th, #preview td { border: 1px solid #d3d8e0; padding: 6px 10px; }
  #preview th { background: #f2f4f8; font-weight: 600; }
  #preview img { max-width: 100%; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  #preview a { color: var(--primary); }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 22px; grid-column: 1 / -1; grid-row: 1; }
  .char-count { font-size: 12px; color: var(--muted); }

  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2430; color: #fff; padding: 11px 20px; border-radius: 9px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); }

  .empty-hint { color: #aab1bd; text-align: center; margin-top: 30px; font-size: 13px; }
  @media (max-width: 820px) {
    .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    main { height: auto; min-height: calc(100vh - 74px); }
    .pane-left { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <div class="logo">M↓</div>
  <div>
    <h1>Markdown → Word 转换器</h1>
    <div class="sub">粘贴 AI 的 Markdown 回复，一键转成带格式的富文本粘贴到 Word</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnExample">插入示例</button>
  <button class="btn" id="btnClear">清空</button>
</header>

<div class="toolbar">
  <button class="btn btn-primary" id="btnCopy">复制富文本（Ctrl+Shift+C）</button>
  <button class="btn" id="btnExportWord">导出 Word 文档</button>
  <button class="btn" id="btnCopyPlain">复制纯文本</button>
  <span class="char-count" id="charCount"></span>
</div>

<main>
  <div class="panes">
    <div class="pane pane-left">
      <div class="pane-head">Markdown 输入 <span class="tip">自动实时转换</span></div>
      <textarea id="input" placeholder="在这里粘贴 AI 的 Markdown 回复…"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">格式预览（Word 中的效果）</div>
      <div id="preview"></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
"use strict";

/* ============ 一个轻量的自包含 Markdown 解析器（无需 CDN，离线可用） ============ */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(text) {
  // 转义
  let t = escapeHtml(text);
  const inter = [];
  // 先处理行内代码，避免其中的符号被误解析
  t = t.replace(/`([^`]+)`/g, function (m, c) {
    inter.push('<code>' + c + '</code>');
    return '\u0000' + (inter.length - 1) + '\u0000';
  });
  // 图片 ![alt](url)
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;?([^&]*?)&quot;?)?\)/g, function (m, a, u, title) {
    return '<img src="' + u + '" alt="' + a + '"' + (title ? ' title="' + title + '"' : '') + '>';
  });
  // 链接 [text](url)
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;?([^&]*?)&quot;?)?\)/g, function (m, tx, u, title) {
    return '<a href="' + u + '"' + (title ? ' title="' + title + '"' : '') + '>' + inline(tx) + '</a>';
  });
  // 加粗 **text** 或 __text__
  t = t.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, '<strong>$1$2</strong>');
  // 斜体 *text* 或 _text_
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)|\b_([^_]+)_\b/g, function (m, p, a, b) { return (p || '') + '<em>' + (a || b) + '</em>'; });
  // 删除线
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  // 还原行内代码
  t = t.replace(/\u0000(\d+)\u0000/g, function (m, i) { return inter[i]; });
  return t;
}

function renderBlocks(lines) {
  const out = [];
  let i = 0;
  let inList = null; // 'ul' or 'ol'
  let listItems = [];

  const closeList = function () {
    if (inList) {
      out.push('<' + inList + '>' + listItems.join('') + '</' + inList + '>');
      inList = null; listItems = [];
    }
  };

  while (i < lines.length) {
    const line = lines[i];

    // 空行
    if (!line.trim() || line.trim() === '\u200b') { closeList(); i++; continue; }

    // 围栏代码块
    const fence = line.match(/^```([\w+-]*)?\s*$/);
    if (fence) {
      closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
      continue;
    }

    // 标题
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { closeList(); const n = h[1].length; out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>'); i++; continue; }

    // 水平线
    if (/^(---|\*\*\*|___)\s*$/.test(line)) { closeList(); out.push('<hr>'); i++; continue; }

    // 表格
    if (line.trim().indexOf('|') >= 0 && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?[\s:|-]*\|\s*$/.test(lines[i+1]) && lines[i+1].indexOf('-') >= 0) {
      closeList();
      const headerCells = line.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); });
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].trim().indexOf('|') >= 0) {
        rows.push(lines[i].replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); }));
        i++;
      }
      let html = '<table><thead><tr>';
      headerCells.forEach(function (c) { html += '<th>' + inline(c) + '</th>'; });
      html += '</tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr>';
        for (let k = 0; k < headerCells.length; k++) {
          html += '<td>' + inline(r[k] || '') + '</td>';
        }
        html += '</tr>';
      });
      html += '</tbody></table>';
      out.push(html);
      continue;
    }

    // 引用
    if (/^>\s?/.test(line)) {
      closeList();
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' + renderBlocks(buf) + '</blockquote>');
      continue;
    }

    // 无序列表
    const ul = line.match(/^\s*([-*+])\s+(.+)$/);
    if (ul) {
      if (inList !== 'ul') { closeList(); inList = 'ul'; }
      listItems.push('<li>' + inline(ul[2]) + '</li>');
      i++; continue;
    }
    // 有序列表
    const ol = line.match(/^\s*(\d+)[.)]\s+(.+)$/);
    if (ol) {
      if (inList !== 'ol') { closeList(); inList = 'ol'; }
      listItems.push('<li>' + inline(ol[2]) + '</li>');
      i++; continue;
    }

    closeList();

    // 普通段落（合并连续非空行直至下一个块标记）
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim()
        && !/^```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])
        && !/^(---|\*\*\*|___)\s*$/.test(lines[i]) && !/^>\s?/.test(lines[i])
        && !/^([-*+]|\d+[.)])\s+/.test(lines[i]) && lines[i].trim().indexOf('|') < 0) {
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  closeList();
  return out.join('\n');
}

function renderMarkdown(src) {
  if (!src || !src.trim()) return '';
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  return renderBlocks(lines);
}

/* ============ 应用到预览 ============ */
const input = document.getElementById('input');
const preview = document.getElementById('preview');
const charCount = document.getElementById('charCount');
let currentHtml = '';

function update() {
  const text = input.value;
  charCount.textContent = text.length.toLocaleString('zh-CN') + ' 字符 · ' + (text.trim() ? '已就绪' : '等待输入');
  if (!text.trim()) {
    preview.innerHTML = '';
    return;
  }
  currentHtml = renderMarkdown(text);
  preview.innerHTML = currentHtml;
}
input.addEventListener('input', update);

/* ============ 复制富文本（含格式，仅用于粘贴到 Word 保留样式） ============ */
function wrapWordHtml(inner) {
  // 为 Word 提供内联样式版本，保证粘贴后格式尽量还原
  const withInline = injectInlineCss(inner);
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">'
    + '<head><meta charset="utf-8"><!--[if gte mso 9]>'
    + '<xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->'
    + '<style>body{font-family:Calibri,"Microsoft YaHei","PingFang SC",sans-serif;font-size:11pt;line-height:1.5;color:#1f2430}'
    + 'h1,h2,h3,h4{font-family:"Microsoft YaHei",Calibri,sans-serif;line-height:1.35}'
    + 'h1{font-size:20pt}h2{font-size:16pt}h3{font-size:13.5pt}h4{font-size:12pt}'
    + 'code{font-family:Consolas,"Courier New",monospace;background:#f1f3f7;padding:1px 4px}'
    + 'pre{background:#0f1722;color:#e6edf7;padding:10px 12px;border-radius:4px}'
    + 'blockquote{margin:6pt 0;padding:2pt 10pt;border-left:3pt solid #2f6fed;background:#f4f7ff;color:#4a5568}'
    + 'ul,ol{margin:4pt 0;padding-left:20pt}table{border-collapse:collapse}td,th{border:1pt solid #d3d8e0;padding:3pt 7pt}'
    + 'hr{border:none;border-top:1pt solid #ccc}</style></head><body>' + withInline + '</body></html>';
}

function injectInlineCss(html) {
  // 给块级元素补充小的内联样式，增强 Word 兼容性
  return html
    .replace(/<h([1-4])([^>]*)>/g, '<h$1$2 style="margin-top:10pt;margin-bottom:4pt">')
    .replace(/<strong([^>]*)>/g, '<strong$1 style="font-weight:bold">')
    .replace(/<em([^>]*)>/g, '<em$1 style="font-style:italic">')
    .replace(/<pre([^>]*)>/g, '<pre$1 style="background:#0f1722;color:#e6edf7;padding:8px 10px;' +
      'border-radius:4px;word-break:break-all;white-space:pre-wrap">');
}

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ok ? 'show success' : 'show';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { t.className = ''; }, 2200);
}

/* 现代 API 写入 HTML + 纯文本 */
async function copyWithClipboardApi(html, plain) {
  try {
    const item = new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' })
    });
    await navigator.clipboard.write([item]);
    return true;
  } catch (e) {
    return false;
  }
}

/* 传统 fallback：利用选区复制富文本 */
function copyWithSelection(html) {
  const holder = document.createElement('div');
  holder.setAttribute('contenteditable', 'true');
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  const sel = window.getSelection();
  sel.removeAllRanges();
  const range = document.createRange();
  range.selectNodeContents(holder);
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  sel.removeAllRanges();
  document.body.removeChild(holder);
  return ok;
}

function copyRich() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const fullHtml = wrapWordHtml(currentHtml);
  const plain = preview.textContent || text;

  let done = false;
  // 先尝试现代 API（可靠保留 HTML）→ 失败再走选区方式
  if (navigator.clipboard && window.ClipboardItem) {
    copyWithClipboardApi(fullHtml, plain).then(function (ok) {
      if (ok) { showToast('已复制富文本 ✅ 到 Word 直接粘贴（Ctrl+V）即可', true); }
      else if (copyWithSelection(fullHtml)) { showToast('已复制富文本 ✅ 到 Word 直接粘贴即可', true); }
      else { showToast('复制失败，请检查浏览器权限'); }
    });
  } else {
    if (copyWithSelection(fullHtml)) { showToast('已复制富文本 ✅ 到 Word 直接粘贴即可', true); }
    else { showToast('复制失败，请检查浏览器权限'); }
  }
}

function copyPlain() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const plain = preview.textContent || text;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(plain).then(function () {
      showToast('已复制纯文本（无格式）', true);
    }).catch(function () {
      const ta = document.createElement('textarea');
      ta.value = plain; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('已复制纯文本（无格式）', true);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = plain; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制纯文本（无格式）', true);
  }
}

/* 导出 Word 文档：用 Blob 下载 .doc 文件 */
function exportWord() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const fullHtml = wrapWordHtml(injectInlineCss(currentHtml));
  const defaultName = (text.match(/^#{1,6}\s+(.+)$/m) || [, '导出文档'])[1].trim().slice(0, 40);
  const blob = new Blob(['\ufeff' + fullHtml], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = defaultName + '.doc';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Word 文档已下载 ✅', true);
}

document.getElementById('btnCopy').addEventListener('click', copyRich);
document.getElementById('btnExportWord').addEventListener('click', exportWord);
document.getElementById('btnCopyPlain').addEventListener('click', copyPlain);
document.getElementById('btnClear').addEventListener('click', function () {
  input.value = ''; update();
});
document.getElementById('btnExample').addEventListener('click', function () {
  input.value = SAMPLE; update(); preview.scrollTop = 0;
  showToast('已插入示例', true);
});
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
    e.preventDefault(); copyRich();
  }
});

/* ============ 示例内容 ============ */
const SAMPLE = `# 项目周报

## 一、本周进展

### 1. 核心功能
- 完成**登录模块**重构，兼容微信与手机号两种方式
- 优化了列表页的 \`Lazy Loading\`，首屏加载提升约 40%
- 修复若干历史 Bug（详见下表）

### 2. 数据表现

| 指标 | 上周 | 本周 | 趋势 |
|------|:----:|:----:|:----:|
| 日活用户 | 12,300 | 14,800 | ↑ 20% |
| 转化率 | 3.2% | 3.8% | ↑ |
| 崩溃率 | 0.9% | 0.3% | ↓ |

> 提示：下周将进入 **性能优化** 冲刺，请各端提前准备压测环境。

## 二、线上问题处理

\`\`\`bash
# 排查命令示例
curl -s https://api.example.com/health | jq '.status'
\`\`\`

## 三、下周计划
1. 完成数字看板 Beta 版
2. 灰度发布新版消息中心
3. 组织**性能压测**专项会议

/* ============ 初始化 ============ */
update();
</script>
</body>
</html>
