<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Word 转换器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #7a8290;
    --primary: #2f6fed;
    --primary-hover: #1f5bd0;
    --code-bg: #f1f3f7;
    --success: #1aa06a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2f6fed, #6f4ff2);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 17px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { background: #f0f2f6; }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 14px;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn:active { transform: translateY(1px); }
  select.fmt-select {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  select.fmt-select:focus { outline: none; border-color: var(--primary); }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    gap: 0;
    height: calc(100vh - 74px);
  }
  .panes { display: grid; grid-template-columns: 1fr 1fr; grid-column: 1 / -1; grid-row: 2; }
  .pane {
    padding: 12px 16px;
    background: var(--panel);
    overflow: auto;
  }
  .pane-left { border-right: 1px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 2px;
    font-size: 12px; color: var(--muted);
    font-weight: 600; letter-spacing: .3px;
  }
  .pane-head .tip { font-weight: 400; margin-left: auto; }
  textarea {
    width: 100%;
    height: calc(100% - 38px);
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: none;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.7;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    color: var(--text);
    background: #fff;
  }
  textarea:focus { outline: none; border-color: var(--primary); }
  #preview {
    height: calc(100% - 38px);
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: auto;
    font-size: 14px;
    line-height: 1.75;
    background: #fff;
  }
  #preview h1, #preview h2, #preview h3, #preview h4 {
    margin: .9em 0 .45em; line-height: 1.35; font-weight: 700;
  }
  #preview h1 { font-size: 1.55em; }
  #preview h2 { font-size: 1.35em; }
  #preview h3 { font-size: 1.18em; }
  #preview h4 { font-size: 1.05em; }
  #preview p { margin: .5em 0; }
  #preview ul, #preview ol { margin: .5em 0; padding-left: 1.6em; }
  #preview li { margin: .2em 0; }
  #preview blockquote {
    margin: .6em 0; padding: .3em .9em;
    border-left: 3px solid var(--primary);
    background: #f4f7ff; color: #4a5568; border-radius: 0 6px 6px 0;
  }
  #preview code {
    background: var(--code-bg);
    padding: .12em .4em; border-radius: 5px;
    font-family: "Consolas", monospace; font-size: .92em;
  }
  #preview pre {
    background: #0f1722; color: #e6edf7;
    padding: 12px 14px; border-radius: 8px; overflow: auto;
  }
  #preview pre code { background: none; padding: 0; color: inherit; }
  #preview table { border-collapse: collapse; margin: .7em 0; }
  #preview th, #preview td { border: 1px solid #d3d8e0; padding: 6px 10px; }
  #preview th { background: #f2f4f8; font-weight: 600; }
  #preview img { max-width: 100%; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  #preview a { color: var(--primary); }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 22px; grid-column: 1 / -1; grid-row: 1; }
  .char-count { font-size: 12px; color: var(--muted); }

  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2430; color: #fff; padding: 11px 20px; border-radius: 9px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); }

  .empty-hint { color: #aab1bd; text-align: center; margin-top: 30px; font-size: 13px; }
  @media (max-width: 820px) {
    .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    main { height: auto; min-height: calc(100vh - 74px); }
    .pane-left { border-right: none; border-bottom: 1px solid var(--border); }
  }
  /* 数学公式预览：MathML 交给浏览器原生渲染 */
  .math-inline { display: inline-block; vertical-align: middle; }
  .math-block { display: block; text-align: center; margin: 10px 0; overflow-x: auto; }
  .math-fallback { color: #b3261e; font-family: Consolas, monospace; font-size: 0.92em; }
  #preview math { font-size: 1.08em; }
  body.dragging .pane { outline: 2px dashed #4a6cf7; outline-offset: -6px; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">M↓</div>
  <div>
    <h1>Markdown → Word 转换器</h1>
    <div class="sub">粘贴 AI 的 Markdown 回复，一键转成带格式的富文本粘贴到 Word</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnExample">插入示例</button>
  <button class="btn" id="btnClear">清空</button>
</header>

<div class="toolbar">
  <button class="btn btn-primary" id="btnCopy">复制富文本（Ctrl+Shift+C）</button>
  <button class="btn" id="btnExportWord">导出 Word 文档</button>
  <select class="fmt-select" id="exportFormat" title="选择导出格式">
    <option value="docx">.docx 原生格式（推荐）</option>
    <option value="doc">.doc 兼容格式</option>
    <option value="tex">.tex LaTeX 源码</option>
  </select>
  <button class="btn" id="btnImportTex" title="选择 .tex 文件并转换为 Markdown（也可以直接把文件拖进窗口）">导入 .tex</button>
  <button class="btn" id="btnCopyPlain">复制纯文本</button>
  <span class="char-count" id="charCount"></span>
</div>

<main>
  <div class="panes">
    <div class="pane pane-left">
      <div class="pane-head">Markdown 输入 <span class="tip">自动实时转换</span></div>
      <textarea id="input" placeholder="在这里粘贴 AI 的 Markdown 回复…"></textarea>
    </div>
    <div class="pane">
      <div class="pane-head">格式预览（Word 中的效果）</div>
      <div id="preview"></div>
    </div>
  </div>
</main>

<div id="toast"></div>

<script>
"use strict";

/* ============ 一个轻量的自包含 Markdown 解析器（无需 CDN，离线可用） ============ */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function decodeHtml(s) {
  return String(s).replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&');
}

function safeUrl(url) {
  const raw = decodeHtml(url).trim();
  if (/^(javascript|data|vbscript):/i.test(raw)) return null;
  return url;
}

function sanitizeFilename(name) {
  const clean = String(name || '')
    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ')
    .replace(/\s+/g, ' ').trim()
    .replace(/[. ]+$/g, '');
  return clean || '导出文档';
}

/* 公式 → 预览 HTML：MathML 交给浏览器原生渲染；
   data-tex 保留原始 LaTeX，导出 .docx 时 docxgen 用它生成 Word 公式（OMML）。 */
function renderMathHTML(tex, block) {
  const cls = block ? 'math-block' : 'math-inline';
  const tag = block ? 'div' : 'span';
  const attr = String(tex).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let inner = '';
  if (window.texconv) {
    try { inner = window.texconv.mathToMathML(tex, !!block); } catch (e) { inner = ''; }
  }
  if (!inner) {
    /* 转换失败就把 LaTeX 原文摆出来 —— 降级显示好过静默丢内容 */
    return '<' + tag + ' class="' + cls + ' math-fallback" data-tex="' + attr + '">' + escapeHtml(tex) + '</' + tag + '>';
  }
  return '<' + tag + ' class="' + cls + '" data-tex="' + attr + '">' + inner + '</' + tag + '>';
}

function inline(text) {
  const inter = [];
  let t = String(text);

  /* 行中出现的 $$..$$ 按行内公式处理 —— 块级必须独占一行，
     否则导出 docx 时 m:oMathPara 无法与文本共存于同一个段落 */
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, function (m, tex) {
    inter.push(renderMathHTML(tex.trim(), false));
    return '\u0000' + (inter.length - 1) + '\u0000';
  });

  /* 公式最先摘出来：$..$ 内容既不能走 HTML 转义，也不能被后面的强调规则误伤。
     先过 isLikelyMath 启发式，把 "$5，那件 $10" 这类美元价格排除在公式之外。 */
  t = t.replace(/\$([^$\n]+?)\$/g, function (m, tex) {
    if (window.texconv && !window.texconv.isLikelyMath(tex)) return m;
    inter.push(renderMathHTML(tex, false));
    return '\u0000' + (inter.length - 1) + '\u0000';
  });

  t = escapeHtml(t);
  t = t.replace(/`([^`]+)`/g, function (m, c) { inter.push('<code>' + c + '</code>'); return '\u0000' + (inter.length - 1) + '\u0000'; });
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;?([^&]*?)&quot;?)?\)/g, function (m, a, u, title) {
    const safe = safeUrl(u);
    if (safe == null) return '<span title="[图片链接已拦截]">' + (a || '') + '</span>';
    return '<img src="' + safe + '" alt="' + a + '"' + (title ? ' title="' + title + '"' : '') + '>';
  });
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;?([^&]*?)&quot;?)?\)/g, function (m, tx, u, title) {
    const safe = safeUrl(u);
    const label = inline(decodeHtml(tx));
    if (safe == null) return label;
    return '<a href="' + safe + '"' + (title ? ' title="' + title + '"' : '') + '>' + label + '</a>';
  });
  t = t.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, '<strong>$1$2</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)|\b_([^_]+)_\b/g, function (m, p, a, b) { return (p || '') + '<em>' + (a || b) + '</em>'; });
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\u0000(\d+)\u0000/g, function (m, i) { return inter[i]; });
  return t;
}

/* 表格分隔行（|---|:--:| 或 --- | --- 两种写法都识别） */
function isDelimRow(line) {
  return line.indexOf('-') >= 0 && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(line);
}
function delimCellCount(line) {
  return line.replace(/^\s*\||\|\s*$/g, '').split('|').length;
}

/* 按缩进把连续的列表行还原成嵌套的 ul / ol */
function buildList(items) {
  let html = '';
  const stack = [];
  for (let n = 0; n < items.length; n++) {
    const it = items[n];
    const type = it.ordered ? 'ol' : 'ul';
    while (stack.length && it.indent < stack[stack.length - 1].indent) {
      html += '</li></' + stack.pop().type + '>';
    }
    if (!stack.length || it.indent > stack[stack.length - 1].indent) {
      html += '<' + type + '>';
      stack.push({ type: type, indent: it.indent });
      html += '<li>' + inline(it.text);
    } else {
      const top = stack[stack.length - 1];
      if (top.type !== type) {
        html += '</li></' + top.type + '><' + type + '>';
        top.type = type;
      } else {
        html += '</li>';
      }
      html += '<li>' + inline(it.text);
    }
  }
  while (stack.length) html += '</li></' + stack.pop().type + '>';
  return html;
}

function renderBlocks(lines) {
  const out = [];
  let i = 0;
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim() || line.trim() === '\u200b') { i++; continue; }
    const fence = line.match(/^```([\w+-]*)?\s*$/);
    if (fence) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
      continue;
    }
    /* 块级公式 $$...$$（可跨行）。用 indexOf 找闭合，闭合后同行的剩余文字
       要继续按 Markdown 处理；找不到闭合时整块按原文输出，绝不吞行。 */
    if (/^\s*\$\$/.test(line)) {
      const rest = line.replace(/^\s*\$\$/, '');
      const end = rest.indexOf('$$');
      if (end >= 0) {
        out.push(renderMathHTML(rest.slice(0, end).trim(), true));
        const after = rest.slice(end + 2).trim();
        if (after) { lines[i] = after; continue; }
        i++;
        continue;
      }
      const mbuf = [rest];
      i++;
      let closed = false;
      while (i < lines.length) {
        const e2 = lines[i].indexOf('$$');
        if (e2 >= 0) { mbuf.push(lines[i].slice(0, e2)); i++; closed = true; break; }
        mbuf.push(lines[i]); i++;
      }
      if (closed) {
        out.push(renderMathHTML(mbuf.join('\n').trim(), true));
      } else {
        out.push('<p>' + escapeHtml(('$$' + mbuf.join('\n')).trim()) + '</p>');
      }
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>'); i++; continue; }
    if (/^(---|\*\*\*|___)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (line.trim().indexOf('|') >= 0 && i + 1 < lines.length && isDelimRow(lines[i + 1])) {
      const headerCells = line.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); });
      // 分隔行列数须与表头一致，否则视为普通段落，避免把含 | 的句子误判为表格
      if (delimCellCount(lines[i + 1]) === headerCells.length) {
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].trim().indexOf('|') >= 0) {
          rows.push(lines[i].replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); }));
          i++;
        }
        let html = '<table><thead><tr>';
        headerCells.forEach(function (c) { html += '<th>' + inline(c) + '</th>'; });
        html += '</tr></thead><tbody>';
        rows.forEach(function (r) {
          html += '<tr>';
          for (let k = 0; k < headerCells.length; k++) { html += '<td>' + inline(r[k] || '') + '</td>'; }
          html += '</tr>';
        });
        html += '</tbody></table>';
        out.push(html);
        continue;
      }
    }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + renderBlocks(buf) + '</blockquote>');
      continue;
    }
    const lm = line.match(listRe);
    if (lm) {
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(listRe);
        if (!m) break;
        items.push({
          indent: m[1].replace(/\t/g, '    ').length,
          ordered: /^\d/.test(m[2]),
          text: m[3]
        });
        i++;
      }
      out.push(buildList(items));
      continue;
    }
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim()
        && !/^```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])
        && !/^(---|\*\*\*|___)\s*$/.test(lines[i]) && !/^>\s?/.test(lines[i])
        && !/^\s*\$\$/.test(lines[i])
        && !listRe.test(lines[i]) && lines[i].trim().indexOf('|') < 0) {
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}

function renderMarkdown(src) {
  if (!src || !src.trim()) return '';
  const lines = src.replace(/\r\n/g, '\n').split('\n');
  return renderBlocks(lines);
}

/* texconv.js — Markdown ↔ LaTeX 双向转换（零第三方依赖、离线可用）
   浏览器与 Node 均可运行，风格与 docxgen.js 保持一致。

   两个层次：
   ┌ 数学层：LaTeX 数学串 → Math AST ─┬→ MathML （预览：浏览器原生渲染）
   │                                  └→ OMML   （导出：Word 可编辑公式）
   └ 文档层：Markdown ↔ LaTeX (.tex)

   设计取舍：解析器只吃 LaTeX 数学的**实用子集** —— 上下标、分式、根式、
   大运算符、定界符、矩阵、重音、正体文本与完整符号表。遇到不认识的命令
   不抛错，降级为可见的原文（\foo），保证「转不了」永远好过「转出错」。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.texconv = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ==================================================================
     一、符号表
     ================================================================== */

  /* 直接映射为单个 Unicode 字符的命令 */
  var SYMBOLS = {
    /* 希腊字母（小写） */
    alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', epsilon: 'ε', varepsilon: 'ε',
    zeta: 'ζ', eta: 'η', theta: 'θ', vartheta: 'ϑ', iota: 'ι', kappa: 'κ',
    lambda: 'λ', mu: 'μ', nu: 'ν', xi: 'ξ', pi: 'π', varpi: 'ϖ', rho: 'ρ',
    varrho: 'ϱ', sigma: 'σ', varsigma: 'ς', tau: 'τ', upsilon: 'υ',
    phi: 'φ', varphi: 'φ', chi: 'χ', psi: 'ψ', omega: 'ω',
    /* 希腊字母（大写） */
    Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Xi: 'Ξ', Pi: 'Π',
    Sigma: 'Σ', Upsilon: 'Υ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω',
    /* 二元运算符 */
    times: '×', div: '÷', pm: '±', mp: '∓', cdot: '⋅', ast: '∗', star: '⋆',
    circ: '∘', bullet: '∙', oplus: '⊕', ominus: '⊖', otimes: '⊗', oslash: '⊘',
    odot: '⊙', cap: '∩', cup: '∪', wedge: '∧', vee: '∨', setminus: '∖',
    sqcap: '⊓', sqcup: '⊔', amalg: '⨿', wr: '≀', dagger: '†', ddagger: '‡',
    /* 关系符 */
    leq: '≤', le: '≤', geq: '≥', ge: '≥', neq: '≠', ne: '≠', equiv: '≡',
    approx: '≈', sim: '∼', simeq: '≃', cong: '≅', propto: '∝', ll: '≪', gg: '≫',
    subset: '⊂', supset: '⊃', subseteq: '⊆', supseteq: '⊇', nsubseteq: '⊈',
    in: '∈', notin: '∉', ni: '∋', perp: '⊥', parallel: '∥', asymp: '≍',
    doteq: '≐', models: '⊨', vdash: '⊢', smile: '⌣', frown: '⌢',
    /* 箭头 */
    to: '→', gets: '←', rightarrow: '→', leftarrow: '←', leftrightarrow: '↔',
    Rightarrow: '⇒', Leftarrow: '⇐', Leftrightarrow: '⇔', implies: '⟹',
    iff: '⟺', uparrow: '↑', downarrow: '↓', updownarrow: '↕',
    mapsto: '↦', longrightarrow: '⟶', longleftarrow: '⟵', longmapsto: '⟼',
    hookrightarrow: '↪', hookleftarrow: '↩', nearrow: '↗', searrow: '↘',
    /* 其他常用符号 */
    infty: '∞', partial: '∂', nabla: '∇', forall: '∀', exists: '∃', nexists: '∄',
    emptyset: '∅', varnothing: '∅', angle: '∠', triangle: '△', square: '□',
    cdots: '⋯', ldots: '…', dots: '…', vdots: '⋮', ddots: '⋱',
    Re: 'ℜ', Im: 'ℑ', wp: '℘', ell: 'ℓ', hbar: 'ℏ', imath: 'ı', jmath: 'ȷ',
    prime: '′', degree: '°', checkmark: '✓', clubsuit: '♣', diamondsuit: '♢',
    heartsuit: '♡', spadesuit: '♠', aleph: 'ℵ', beth: 'ℶ', top: '⊤', bot: '⊥',
    vert: '|', lVert: '‖', rVert: '‖', langle: '⟨', rangle: '⟩',
    lceil: '⌈', rceil: '⌉', lfloor: '⌊', rfloor: '⌋',
    /* 逻辑/集合专用（保持间距语义） */
    land: '∧', lor: '∨', lnot: '¬', neg: '¬', therefore: '∴', because: '∵'
  };

  /* 需要上下限的大运算符 */
  var BIG_OPS = {
    sum: '∑', prod: '∏', coprod: '∐', bigcup: '⋃', bigcap: '⋂',
    bigoplus: '⨁', bigotimes: '⨂', bigodot: '⨀', bigvee: '⋁', bigwedge: '⋀',
    bigsqcup: '⨆', biguplus: '⨄', int: '∫', iint: '∬', iiint: '∭',
    oint: '∮', oiint: '∯'
  };

  /* \lim 这类「大运算符形态但内容是文字」的命令 */
  var LIM_OPS = {
    lim: 'lim', limsup: 'lim sup', liminf: 'lim inf',
    max: 'max', min: 'min', sup: 'sup', inf: 'inf',
    det: 'det', gcd: 'gcd', Pr: 'Pr', lcm: 'lcm'
  };

  /* 正体函数名 */
  var FUNCS = {
    sin: 1, cos: 1, tan: 1, cot: 1, sec: 1, csc: 1,
    arcsin: 1, arccos: 1, arctan: 1, arccot: 1,
    sinh: 1, cosh: 1, tanh: 1, coth: 1,
    log: 1, ln: 1, lg: 1, exp: 1, ker: 1, dim: 1, hom: 1, arg: 1, deg: 1
  };

  /* 重音：LaTeX 命令 → [OMML 重音字符, MathML 重音符号] */
  var ACCENTS = {
    vec: ['⃗', '→'], hat: ['̂', '^'], widehat: ['̂', '^'],
    bar: ['‾', '‾'], overline: ['‾', '‾'],
    tilde: ['̃', '~'], widetilde: ['̃', '~'],
    dot: ['̇', '˙'], ddot: ['̈', '¨'],
    check: ['̌', 'ˇ'], breve: ['̆', '˘'], acute: ['́', '´'], grave: ['̀', '`']
  };

  /* 下方标注 */
  var UNDER_ACCENTS = {
    underline: ['_', '_'], underbrace: ['⏟', '⏟']
  };

  /* 间距命令 → OMML 的 m:argSz / 直接用空格字符更稳妥 */
  var SPACES = {
    ',' : ' ', ':' : ' ', ';' : ' ', '!' : '', quad: '  ', qquad: '    '
  };

  /* 数学字母表：只覆盖有 Unicode 对应且常用的部分，其余回退普通字母 */
  var BLACKBOARD = { R: 'ℝ', N: 'ℕ', Z: 'ℤ', Q: 'ℚ', C: 'ℂ', P: 'ℙ', H: 'ℍ', E: '𝔼', F: '𝔽' };
  var CAL = { L: 'ℒ', M: 'ℳ', B: 'ℬ', E: 'ℰ', F: 'ℱ', G: '𝒢', H: 'ℋ', I: 'ℐ', R: 'ℛ' };

  /* 定界符：\left \right 与 \big 系列后面允许出现的符号 */
  var DELIMS = {
    '(': '(', ')': ')', '[': '[', ']': ']', '{': '{', '}': '}',
    '|': '|', '/': '/', '.': '', '\\': '', 'langle': '⟨', 'rangle': '⟩',
    'vert': '|', 'Vert': '‖', 'lVert': '‖', 'rVert': '‖', '|': '|',
    'lceil': '⌈', 'rceil': '⌉', 'lfloor': '⌊', 'rfloor': '⌋',
    'uparrow': '↑', 'downarrow': '↓', 'updownarrow': '↕'
  };

  /* 矩阵类环境 */
  var MATRIX_ENVS = {
    matrix: { open: '', close: '' },
    pmatrix: { open: '(', close: ')' },
    bmatrix: { open: '[', close: ']' },
    Bmatrix: { open: '{', close: '}' },
    vmatrix: { open: '|', close: '|' },
    Vmatrix: { open: '‖', close: '‖' },
    cases: { open: '{', close: '' },
    array: { open: '', close: '' },
    aligned: { open: '', close: '' },
    align: { open: '', close: '' },
    gathered: { open: '', close: '' }
  };

  /* ==================================================================
     二、词法分析
     ================================================================== */

  function tokenize(src) {
    var toks = [];
    var i = 0;
    var n = src.length;
    while (i < n) {
      var c = src.charAt(i);

      if (c === '\\') {
        var m = /^\\([a-zA-Z]+|.)/.exec(src.slice(i));
        if (!m) { i++; continue; }
        var name = m[1];
        i += m[0].length;
        /* \\ 是换行，不是命令 */
        if (name === '\\') toks.push({ t: 'row' });
        else toks.push({ t: 'cmd', name: name });
        continue;
      }

      if (c === '{') { toks.push({ t: 'open' }); i++; continue; }
      if (c === '}') { toks.push({ t: 'close' }); i++; continue; }
      if (c === '^') { toks.push({ t: 'sup' }); i++; continue; }
      if (c === '_') { toks.push({ t: 'sub' }); i++; continue; }
      if (c === '&') { toks.push({ t: 'amp' }); i++; continue; }
      if (c === '[') { toks.push({ t: 'lbr' }); i++; continue; }
      if (c === ']') { toks.push({ t: 'rbr' }); i++; continue; }
      if (/\s/.test(c)) { i++; continue; }

      if (/[0-9]/.test(c)) {
        var m2 = /^[0-9]+(?:\.[0-9]+)?/.exec(src.slice(i));
        toks.push({ t: 'num', v: m2[0] });
        i += m2[0].length;
        continue;
      }

      toks.push({ t: 'char', v: c });
      i++;
    }
    return toks;
  }

  /* ==================================================================
     三、语法分析 → Math AST
     ================================================================== */

  function parse(src) {
    var toks = tokenize(String(src == null ? '' : src));
    var pos = 0;

    function peek(k) { return toks[pos + (k || 0)]; }
    function atEnd() { return pos >= toks.length; }

    /* 组的边界：close / 上下标 / 大运算符的 body 分界 */
    function isStop(t, endType) {
      if (!t) return true;
      if (endType && t.t === endType) return true;
      if (t.t === 'close') return true;
      if (t.t === 'sup' || t.t === 'sub') return true;
      if (t.t === 'amp' || t.t === 'row') return true;
      return false;
    }

    /* 解析一个「单元」：{...} 整体 或 单个原子 */
    function parseUnit() {
      var t = peek();
      if (!t) return { type: 'empty' };
      if (t.t === 'open') {
        pos++;
        var items = parseItems('close');
        if (peek() && peek().t === 'close') pos++;
        return { type: 'group', items: items };
      }
      return parseAtom();
    }

    /* 连续解析若干原子，直到遇到 endType 或停止符 */
    function parseItems(endType) {
      var items = [];
      while (!atEnd() && !isStop(peek(), endType)) {
        items.push(parseScripted());
      }
      return items;
    }

    /* 原子 + 可选上下标 */
    function parseScripted() {
      var base = parseAtom();
      var sup = null, sub = null;
      while (!atEnd() && (peek().t === 'sup' || peek().t === 'sub')) {
        var kind = peek().t;
        pos++;
        var g = parseUnit();
        if (kind === 'sup') { if (sup === null) sup = g; else base = { type: 'sup', base: base, sup: g }; }
        else { if (sub === null) sub = g; else base = { type: 'sub', base: base, sub: g }; }
      }

      /* 大运算符吸收紧随其后的一个单元作为被作用体 */
      if (base.type === 'op' && (sup || sub)) {
        var body = null;
        if (!atEnd() && !isStop(peek(), null) && peek().t !== 'cmdStop') {
          body = parseScripted();
        }
        return { type: 'nary', name: base.name, chr: base.chr, text: base.text, sup: sup, sub: sub, body: body };
      }

      if (sup && sub) return { type: 'subsup', base: base, sup: sup, sub: sub };
      if (sup) return { type: 'sup', base: base, sup: sup };
      if (sub) return { type: 'sub', base: base, sub: sub };
      return base;
    }

    /* 读取紧随 \left / \right 之后的定界符字符 */
    function readDelim() {
      var t = peek();
      if (!t) return '';
      if (t.t === 'char') { pos++; return DELIMS[t.v] != null ? DELIMS[t.v] : t.v; }
      if (t.t === 'open') { pos++; return '{'; }
      if (t.t === 'close') { pos++; return '}'; }
      if (t.t === 'cmd') {
        pos++;
        /* \{ \} \| 这类转义定界符 */
        if (t.name === '{') return '{';
        if (t.name === '}') return '}';
        if (t.name === '|') return '‖';
        if (DELIMS[t.name] != null) return DELIMS[t.name];
        return '';
      }
      if (t.t === 'lbr') { pos++; return '['; }
      if (t.t === 'rbr') { pos++; return ']'; }
      return '';
    }

    /* \begin{env} ... \end{env} —— 按 & 分列、\\ 分行 */
    function parseEnv() {
      /* 环境名 */
      var env = '';
      var t = peek();
      if (t && t.t === 'open') {
        pos++;
        var buf = '';
        while (!atEnd() && peek().t !== 'close') {
          var x = peek(); pos++;
          if (x.t === 'char') buf += x.v;
          else if (x.t === 'cmd') buf += '\\' + x.name;
        }
        if (peek() && peek().t === 'close') pos++;
        env = buf;
      }

      var rows = [[]];
      var cell = null;
      while (!atEnd()) {
        var tk = peek();
        if (tk.t === 'cmd' && tk.name === 'end') {
          pos++;
          /* 吃掉 {env} */
          if (peek() && peek().t === 'open') {
            pos++;
            while (!atEnd() && peek().t !== 'close') pos++;
            if (peek() && peek().t === 'close') pos++;
          }
          break;
        }
        if (tk.t === 'amp') { pos++; rows[rows.length - 1].push(cell || { type: 'empty' }); cell = null; continue; }
        if (tk.t === 'row') { pos++; rows[rows.length - 1].push(cell || { type: 'empty' }); rows.push([]); cell = null; continue; }
        if (tk.t === 'sup' || tk.t === 'sub') {
          /* \begin{array} 里可能紧跟 {c} 列格式说明，已在上面吞掉；这里作为异常兜底 */
          pos++; continue;
        }
        if (tk.t === 'open') {
          /* array 的 {ccc} 列声明：出现在第一行第一列之前，直接跳过 */
          var save = pos;
          pos++;
          var inner = '';
          var depth = 1, ok = true;
          while (!atEnd() && depth > 0) {
            var y = peek();
            if (y.t === 'open') depth++;
            else if (y.t === 'close') { depth--; if (depth === 0) { pos++; break; } }
            else if (y.t === 'char') inner += y.v;
            pos++;
          }
          if (rows.length === 1 && rows[0].length === 0 && !cell && /^[lcr|@\s{}pmb]+$/.test(inner)) continue;
          pos = save;
        }
        var unit = parseScripted();
        if (cell && cell.type === 'group') cell.items.push(unit);
        else if (cell) cell = { type: 'group', items: [cell, unit] };
        else cell = unit;
      }
      rows[rows.length - 1].push(cell || { type: 'empty' });
      /* 去掉末尾因换行产生的空行 */
      if (rows.length > 1) {
        var last = rows[rows.length - 1];
        if (last.length === 1 && last[0].type === 'empty') rows.pop();
      }
      return { type: 'matrix', env: env, rows: rows };
    }

    /* 读取 {...} 的原始文本（用于 \text / \begin 的参数） */
    function readRawText() {
      var t = peek();
      if (!t) return '';
      if (t.t !== 'open') {
        var one = parseUnit();
        return collectRaw(one);
      }
      pos++;
      var buf = '';
      var depth = 1;
      while (!atEnd() && depth > 0) {
        var x = peek(); pos++;
        if (x.t === 'open') { depth++; buf += '{'; continue; }
        if (x.t === 'close') { depth--; if (depth === 0) break; buf += '}'; continue; }
        if (x.t === 'cmd') { buf += '\\' + x.name; continue; }
        if (x.t === 'char') { buf += x.v; continue; }
        if (x.t === 'num') { buf += x.v; continue; }
        if (x.t === 'sup') { buf += '^'; continue; }
        if (x.t === 'sub') { buf += '_'; continue; }
      }
      return buf;
    }

    function collectRaw(node) {
      if (!node) return '';
      if (node.type === 'sym' || node.type === 'ident' || node.type === 'num') return String(node.v);
      if (node.type === 'func') return node.v;
      if (node.type === 'group') return node.items.map(collectRaw).join('');
      if (node.type === 'raw') return node.v;
      return '';
    }

    function parseAtom() {
      var t = peek();
      if (!t) return { type: 'empty' };

      if (t.t === 'num') { pos++; return { type: 'num', v: t.v }; }

      if (t.t === 'char') {
        pos++;
        var ch = t.v;
        /* 单字符就是变量；运算符单独成 <mo> */
        if ('+-=<>*/()[]|,;:!?'.indexOf(ch) >= 0) return { type: 'sym', v: ch };
        if (ch === "'") return { type: 'sym', v: '′' };
        if (ch === '-') return { type: 'sym', v: '−' };
        return { type: 'ident', v: ch };
      }

      if (t.t === 'open') return parseUnit(); /* { 开头的裸组 */

      if (t.t === 'cmd') {
        var name = t.name;
        pos++;

        /* --- 分式 --- */
        if (name === 'frac' || name === 'dfrac' || name === 'tfrac' || name === 'cfrac') {
          return { type: 'frac', num: parseUnit(), den: parseUnit() };
        }
        /* --- 二项式系数 --- */
        if (name === 'binom' || name === 'dbinom' || name === 'tbinom') {
          return { type: 'binom', num: parseUnit(), den: parseUnit() };
        }
        /* --- 根式 --- */
        if (name === 'sqrt') {
          var deg = null;
          if (peek() && peek().t === 'lbr') {
            pos++;
            deg = { type: 'group', items: parseItems('rbr') };
            if (peek() && peek().t === 'rbr') pos++;
          }
          return { type: 'sqrt', deg: deg, body: parseUnit() };
        }
        /* --- 大运算符 --- */
        if (BIG_OPS[name]) return { type: 'op', name: name, chr: BIG_OPS[name] };
        if (LIM_OPS[name]) return { type: 'op', name: name, chr: LIM_OPS[name], text: true };
        if (name === 'operatorname') {
          var on = readRawText();
          return { type: 'op', name: on, chr: on, text: true };
        }
        /* --- 定界符 --- */
        if (name === 'left') {
          var open = readDelim();
          var items = [];
          while (!atEnd()) {
            var q = peek();
            if (q.t === 'cmd' && q.name === 'right') { pos++; break; }
            items.push(parseScripted());
          }
          var close = readDelim();
          return { type: 'delim', open: open, close: close, items: items };
        }
        if (name === 'right') { /* 落单的 \right，忽略 */ return { type: 'empty' }; }
        if (name === 'big' || name === 'Big' || name === 'bigg' || name === 'Bigg'
          || name === 'bigl' || name === 'Bigl' || name === 'biggl' || name === 'Biggl'
          || name === 'bigr' || name === 'Bigr' || name === 'biggr' || name === 'Biggr'
          || name === 'bigm' || name === 'Bigm') {
          var d = readDelim();
          return { type: 'sym', v: d || '' };
        }
        /* --- 环境 --- */
        if (name === 'begin') return parseEnv();
        if (name === 'end') {
          if (peek() && peek().t === 'open') { pos++; while (!atEnd() && peek().t !== 'close') pos++; if (peek()) pos++; }
          return { type: 'empty' };
        }
        /* --- 重音 --- */
        if (ACCENTS[name]) return { type: 'accent', chr: ACCENTS[name][0], mathml: ACCENTS[name][1], body: parseUnit() };
        if (UNDER_ACCENTS[name]) return { type: 'under', chr: UNDER_ACCENTS[name][0], body: parseUnit() };
        if (name === 'overbrace') return { type: 'over', chr: '⏞', body: parseUnit() };
        if (name === 'underbrace') return { type: 'under', chr: '⏟', body: parseUnit() };
        /* --- 文本与字体 --- */
        if (name === 'text' || name === 'textrm' || name === 'mbox' || name === 'hbox') {
          return { type: 'text', v: readRawText(), style: 'p' };
        }
        if (name === 'mathrm' || name === 'operatorname') return { type: 'text', v: readRawText(), style: 'p' };
        if (name === 'mathbf' || name === 'boldsymbol' || name === 'bm') return { type: 'text', v: readRawText(), style: 'b' };
        if (name === 'mathit') return { type: 'text', v: readRawText(), style: 'i' };
        if (name === 'mathbb') return { type: 'bb', v: readRawText() };
        if (name === 'mathcal' || name === 'mathscr') return { type: 'cal', v: readRawText() };
        if (name === 'mathsf') return { type: 'text', v: readRawText(), style: 'p' };
        if (name === 'mathtt') return { type: 'text', v: readRawText(), style: 'p' };
        /* --- 间距 --- */
        if (SPACES[name] != null) return { type: 'space', v: SPACES[name] };
        /* --- 函数名 --- */
        if (FUNCS[name]) return { type: 'func', v: name };
        /* --- 普通符号 --- */
        if (SYMBOLS[name] != null) return { type: 'sym', v: SYMBOLS[name], cmd: name };
        /* --- 未识别：原样保留，保证可见而非静默丢失 --- */
        return { type: 'raw', v: '\\' + name };
      }

      /* 兜底：任何未预期的 token 都前进一格，避免死循环 */
      pos++;
      return { type: 'empty' };
    }

    var items = parseItems(null);
    return { type: 'root', items: items };
  }

  /* ==================================================================
     四、AST → MathML（供浏览器原生渲染预览）
     ================================================================== */

  function escXml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function mathmlOf(nodes) {
    return nodes.map(function (n) { return mlNode(n); }).join('');
  }

  function mlNode(n) {
    if (!n) return '';
    switch (n.type) {
      case 'empty': return '';
      case 'num': return '<mn>' + escXml(n.v) + '</mn>';
      case 'ident': return '<mi>' + escXml(n.v) + '</mi>';
      case 'sym': return '<mo>' + escXml(n.v) + '</mo>';
      /* 无上下标的大运算符（\sum、\lim …）：按普通符号输出。
         漏掉这个分支会让 ∑ 在整条链路上凭空消失。 */
      case 'op': return '<mo>' + escXml(n.chr) + '</mo>';
      case 'func': return '<mi mathvariant="normal">' + escXml(n.v) + '</mi>';
      case 'raw': return '<mtext>' + escXml(n.v) + '</mtext>';
      case 'text': return '<mtext>' + escXml(n.v) + '</mtext>';
      case 'space': return '<mspace width="0.3em"/>';
      case 'group': return '<mrow>' + mathmlOf(n.items) + '</mrow>';
      case 'sup': return '<msup>' + mlWrap(n.base) + mlWrap(n.sup) + '</msup>';
      case 'sub': return '<msub>' + mlWrap(n.base) + mlWrap(n.sub) + '</msub>';
      case 'subsup': return '<msubsup>' + mlWrap(n.base) + mlWrap(n.sub) + mlWrap(n.sup) + '</msubsup>';
      case 'frac': return '<mfrac>' + mlWrap(n.num) + mlWrap(n.den) + '</mfrac>';
      case 'binom':
        return '<mfenced open="(" close=")"><mfrac linethickness="0">'
          + mlWrap(n.num) + mlWrap(n.den) + '</mfrac></mfenced>';
      case 'sqrt':
        return n.deg
          ? '<mroot>' + mlWrap(n.body) + mlWrap(n.deg) + '</mroot>'
          : '<msqrt>' + mlWrap(n.body) + '</msqrt>';
      case 'nary': {
        var op = '<mo>' + escXml(n.chr) + '</mo>';
        var und = n.sub ? mlWrap(n.sub) : '<mrow/>';
        var ovr = n.sup ? mlWrap(n.sup) : null;
        var core = ovr ? '<munderover>' + op + und + ovr + '</munderover>'
                       : '<munder>' + op + und + '</munder>';
        return '<mrow>' + core + (n.body ? mlWrap(n.body) : '') + '</mrow>';
      }
      case 'delim':
        return '<mfenced open="' + escXml(n.open) + '" close="' + escXml(n.close) + '">'
          + mathmlOf(n.items) + '</mfenced>';
      case 'matrix': {
        var rows = n.rows.map(function (r) {
          return '<mtr>' + r.map(function (c) { return '<mtd>' + mlWrap(c) + '</mtd>'; }).join('') + '</mtr>';
        }).join('');
        var tbl = '<mtable>' + rows + '</mtable>';
        var env = MATRIX_ENVS[n.env];
        if (env && (env.open || env.close)) {
          return '<mfenced open="' + escXml(env.open) + '" close="' + escXml(env.close) + '">' + tbl + '</mfenced>';
        }
        return tbl;
      }
      case 'accent': return '<mover>' + mlWrap(n.body) + '<mo>' + escXml(n.mathml || n.chr) + '</mo></mover>';
      case 'under': return '<munder>' + mlWrap(n.body) + '<mo>' + escXml(n.chr) + '</mo></munder>';
      case 'over': return '<mover>' + mlWrap(n.body) + '<mo>' + escXml(n.chr) + '</mo></mover>';
      case 'bb': {
        var s = '';
        for (var i = 0; i < n.v.length; i++) {
          s += '<mi>' + escXml(BLACKBOARD[n.v.charAt(i)] || n.v.charAt(i)) + '</mi>';
        }
        return '<mrow>' + s + '</mrow>';
      }
      case 'cal': {
        var s2 = '';
        for (var j = 0; j < n.v.length; j++) {
          s2 += '<mi>' + escXml(CAL[n.v.charAt(j)] || n.v.charAt(j)) + '</mi>';
        }
        return '<mrow>' + s2 + '</mrow>';
      }
      case 'root': return mathmlOf(n.items);
      default: return '';
    }
  }

  /* 需要保证是单个元素的场合（msup/mfrac 的槽位） */
  function mlWrap(n) {
    if (!n) return '<mrow/>';
    if (n.type === 'group') return '<mrow>' + mathmlOf(n.items) + '</mrow>';
    var s = mlNode(n);
    return s || '<mrow/>';
  }

  function mathToMathML(tex, display) {
    var ast = parse(tex);
    var inner = mathmlOf(ast.items);
    return '<math xmlns="http://www.w3.org/1998/Math/MathML"'
      + (display ? ' display="block"' : '')
      + '>' + (inner || '<mrow/>') + '</math>';
  }

  /* ==================================================================
     五、AST → OMML（供 .docx 导出为 Word 原生可编辑公式）
     ================================================================== */

  var MATH_FONT = '<w:rFonts w:ascii="Cambria Math" w:hAnsi="Cambria Math"/>';

  function ommlRun(text, style) {
    if (text === '') return '';
    var mpr = style && style !== 'i' ? '<m:rPr><m:sty m:val="' + style + '"/></m:rPr>' : '';
    return '<m:r>' + mpr + '<w:rPr>' + MATH_FONT + '</w:rPr>'
      + '<m:t xml:space="preserve">' + escXml(text) + '</m:t></m:r>';
  }

  function ommlOf(nodes) {
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var piece = ommlNode(nodes[i]);
      if (!piece) continue;
      /* 相邻的纯文本 run 合并，减少 Word 里的 run 数量 */
      var prev = out[out.length - 1];
      if (piece.runs && prev && prev.runs) {
        prev.runs = prev.runs.concat(piece.runs);
        prev.xml = prev.runs.map(function (r) { return ommlRun(r.t, r.s); }).join('');
      } else {
        out.push(piece);
      }
    }
    return out.map(function (p) { return p.xml; }).join('');
  }

  /* 统一包装：文本类节点产出 runs 以便合并，其余直接给 xml */
  function wrap(xml, runs) { return { xml: xml, runs: runs || null }; }

  function ommlNode(n) {
    if (!n) return null;
    switch (n.type) {
      case 'empty': return null;
      case 'num': return wrap(ommlRun(n.v, 'p'), [{ t: n.v, s: 'p' }]);
      case 'ident': return wrap(ommlRun(n.v, 'i'), [{ t: n.v, s: 'i' }]);
      case 'sym': return wrap(ommlRun(n.v, 'p'), [{ t: n.v, s: 'p' }]);
      /* 同上：无上下标的大运算符必须仍然输出字符本身 */
      case 'op': return wrap(ommlRun(n.chr, 'p'), [{ t: n.chr, s: 'p' }]);
      case 'func': return wrap(ommlRun(n.v, 'p'), [{ t: n.v, s: 'p' }]);
      case 'raw': return wrap(ommlRun(n.v, 'p'), [{ t: n.v, s: 'p' }]);
      case 'text': return wrap(ommlRun(n.v, n.style || 'p'), [{ t: n.v, s: n.style || 'p' }]);
      case 'space': return wrap(ommlRun(' ', 'p'));
      case 'group': return wrap(ommlOf(n.items));
      case 'sup': return wrap('<m:sSup><m:e>' + ommlSlot(n.base) + '</m:e><m:sup>' + ommlSlot(n.sup) + '</m:sup></m:sSup>');
      case 'sub': return wrap('<m:sSub><m:e>' + ommlSlot(n.base) + '</m:e><m:sub>' + ommlSlot(n.sub) + '</m:sub></m:sSub>');
      case 'subsup': return wrap('<m:sSubSup><m:e>' + ommlSlot(n.base) + '</m:e><m:sub>' + ommlSlot(n.sub)
        + '</m:sub><m:sup>' + ommlSlot(n.sup) + '</m:sup></m:sSubSup>');
      case 'frac': return wrap('<m:f><m:fPr><m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:fPr>'
        + '<m:num>' + ommlSlot(n.num) + '</m:num><m:den>' + ommlSlot(n.den) + '</m:den></m:f>');
      case 'binom': return wrap('<m:d><m:dPr><m:begChr m:val="("/><m:endChr m:val=")"/>'
        + '<m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:dPr><m:e>'
        + '<m:f><m:fPr><m:type m:val="noBar"/><m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:fPr>'
        + '<m:num>' + ommlSlot(n.num) + '</m:num><m:den>' + ommlSlot(n.den) + '</m:den></m:f>'
        + '</m:e></m:d>');
      case 'sqrt': {
        var degXml = n.deg
          ? '<m:deg>' + ommlSlot(n.deg) + '</m:deg>'
          : '<m:degHide m:val="1"/><m:deg/>';
        return wrap('<m:rad><m:radPr>' + degXml + '<m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:radPr>'
          + '<m:e>' + ommlSlot(n.body) + '</m:e></m:rad>');
      }
      case 'nary': {
        var isText = !!n.text;
        var pr = '<m:naryPr><m:chr m:val="' + escXml(n.chr) + '"/>'
          + '<m:limLoc m:val="' + (isText ? 'undOvr' : 'subSup') + '"/>';
        if (isText) pr += '<m:subHide m:val="0"/><m:supHide m:val="0"/>';
        pr += '<m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:naryPr>';
        var subX = n.sub && n.sub.type !== 'empty' ? ommlSlot(n.sub) : (isText ? '<m:sub><m:r><w:rPr>' + MATH_FONT + '</w:rPr><m:t/></m:r></m:sub>' : '<m:sub/>');
        var supX = n.sup && n.sup.type !== 'empty' ? ommlSlot(n.sup) : (isText ? '<m:sup><m:r><w:rPr>' + MATH_FONT + '</w:rPr><m:t/></m:r></m:sup>' : '<m:sup/>');
        return wrap('<m:nary>' + pr + subX + supX + '<m:e>' + ommlSlot(n.body) + '</m:e></m:nary>');
      }
      case 'delim':
        return wrap('<m:d><m:dPr>'
          + (n.open ? '<m:begChr m:val="' + escXml(n.open) + '"/>' : '<m:begChr m:val=""/>')
          + (n.close ? '<m:endChr m:val="' + escXml(n.close) + '"/>' : '<m:endChr m:val=""/>')
          + '<m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:dPr>'
          + '<m:e>' + ommlOf(n.items) + '</m:e></m:d>');
      case 'matrix': {
        var mc = '<m:mPr><m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:mPr>';
        var rows = n.rows.map(function (r) {
          return '<m:mr>' + r.map(function (c) { return '<m:e>' + ommlSlot(c) + '</m:e>'; }).join('') + '</m:mr>';
        }).join('');
        var tbl = '<m:m>' + mc + rows + '</m:m>';
        var env = MATRIX_ENVS[n.env];
        if (env && (env.open || env.close)) {
          return wrap('<m:d><m:dPr>'
            + (env.open ? '<m:begChr m:val="' + escXml(env.open) + '"/>' : '')
            + (env.close ? '<m:endChr m:val="' + escXml(env.close) + '"/>' : '')
            + '<m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:dPr>'
            + '<m:e>' + tbl + '</m:e></m:d>');
        }
        return wrap(tbl);
      }
      case 'accent': return wrap('<m:acc><m:accPr><m:chr m:val="' + escXml(n.chr) + '"/>'
        + '<m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:accPr>'
        + '<m:e>' + ommlSlot(n.body) + '</m:e></m:acc>');
      case 'under': return wrap('<m:limLow><m:limLowPr><m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:limLowPr>'
        + '<m:e>' + ommlSlot(n.body) + '</m:e>'
        + '<m:lim>' + ommlRun(n.chr, 'p') + '</m:lim></m:limLow>');
      case 'over': return wrap('<m:limUpp><m:limUppPr><m:ctrlPr><w:rPr>' + MATH_FONT + '</w:rPr></m:ctrlPr></m:limUppPr>'
        + '<m:e>' + ommlSlot(n.body) + '</m:e>'
        + '<m:lim>' + ommlRun(n.chr, 'p') + '</m:lim></m:limUpp>');
      case 'bb': {
        var s = '';
        for (var i = 0; i < n.v.length; i++) s += (BLACKBOARD[n.v.charAt(i)] || n.v.charAt(i));
        return wrap(ommlRun(s, 'p'), [{ t: s, s: 'p' }]);
      }
      case 'cal': {
        var s2 = '';
        for (var j = 0; j < n.v.length; j++) s2 += (CAL[n.v.charAt(j)] || n.v.charAt(j));
        return wrap(ommlRun(s2, 'i'), [{ t: s2, s: 'i' }]);
      }
      case 'root': return wrap(ommlOf(n.items));
      default: return null;
    }
  }

  /* 槽位内容：空槽必须显式给空 run，否则 Word 会认为公式结构缺损 */
  function ommlSlot(n) {
    if (!n || n.type === 'empty') return '<m:r><w:rPr>' + MATH_FONT + '</w:rPr><m:t/></m:r>';
    if (n.type === 'group') {
      var inner = ommlOf(n.items);
      return inner || '<m:r><w:rPr>' + MATH_FONT + '</w:rPr><m:t/></m:r>';
    }
    var piece = ommlNode(n);
    return piece ? piece.xml : '<m:r><w:rPr>' + MATH_FONT + '</w:rPr><m:t/></m:r>';
  }

  function mathToOmml(tex) {
    var ast = parse(tex);
    return '<m:oMath>' + ommlOf(ast.items) + '</m:oMath>';
  }

  function mathToOmmlPara(tex) {
    var ast = parse(tex);
    return '<m:oMathPara><m:oMathParaPr><m:jc m:val="center"/></m:oMathParaPr>'
      + '<m:oMath>' + ommlOf(ast.items) + '</m:oMath></m:oMathPara>';
  }

  /* ==================================================================
     六、文档层：Markdown → LaTeX
     ================================================================== */

  /* LaTeX 特殊字符转义。公式、代码、链接片段在这之前已换成占位符，
     不会经过这里 —— 否则 \textbf 里的反斜杠会被自己转义掉。 */
  function texEscape(s) {
    return String(s)
      .replace(/\\/g, '\u0003')
      .replace(/([#$%&_{}])/g, '\\$1')
      .replace(/~/g, '\\textasciitilde{}')
      .replace(/\^/g, '\\textasciicircum{}')
      .replace(/\u0003/g, '\\textbackslash{}');
  }

  var MD_LIST_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

  function mdIsDelimRow(line) {
    return line.indexOf('-') >= 0 && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(line);
  }

  function mdSplitRow(line) {
    return line.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); });
  }

  /* 行内元素 → LaTeX。顺序是关键：
     先用占位符摘出公式/代码/图片/链接，再转义普通文本，最后处理强调。
     这样强调产生的 \textbf 不会在后续步骤里被转义，而强调内部的文字
     已经在转义阶段处理过了。 */
  function inlineTex(s) {
    var holes = [];
    function hole(tex) { holes.push(tex); return '\u0001' + (holes.length - 1) + '\u0001'; }
    function escPath(u) { return String(u).replace(/([%#&_{}])/g, '\\$1'); }

    var t = String(s);

    t = t.replace(/\$([^$\n]+?)\$/g, function (m, body) { return hole('$' + body + '$'); });
    t = t.replace(/`([^`]+)`/g, function (m, c) { return hole('\\texttt{' + texEscape(c) + '}'); });
    t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (m, alt, u) {
      return hole('\\includegraphics[width=0.9\\linewidth]{' + escPath(u) + '}');
    });
    t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (m, label, u) {
      return hole('\\href{' + escPath(u) + '}{' + inlineTex(label) + '}');
    });
    /* 删除线也要在转义之前摘出来：~ 是 LaTeX 特殊字符，
       一旦先被转成 \textasciitilde{} 就再也认不出 ~~ 了。 */
    t = t.replace(/~~([^~]+)~~/g, function (m, c) { return hole('\\sout{' + texEscape(c) + '}'); });

    t = texEscape(t);

    t = t.replace(/\*\*([^*]+)\*\*/g, '\\textbf{$1}');
    t = t.replace(/__([^_]+)__/g, '\\textbf{$1}');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, function (m, p, a) { return p + '\\emph{' + a + '}'; });

    return t.replace(/\u0001(\d+)\u0001/g, function (m, i) { return holes[+i]; });
  }

  /* 列表缩进树 → 嵌套 itemize/enumerate。与索引页 HTML 渲染同源的算法，
     这里只是把输出从 <ul>/<ol> 换成 LaTeX 环境。 */
  function renderListTex(items, start, indent) {
    var buf = [];
    var cur = start;
    var open = null;
    while (cur < items.length) {
      var it = items[cur];
      if (it.indent < indent) break;
      if (it.indent > indent) {
        var sub = renderListTex(items, cur, it.indent);
        buf.push(sub.tex);
        cur = sub.next;
        continue;
      }
      var want = it.ordered ? 'enumerate' : 'itemize';
      if (open !== want) {
        if (open) buf.push('\\end{' + open + '}');
        buf.push('\\begin{' + want + '}');
        open = want;
      }
      buf.push('\\item ' + inlineTex(it.text));
      cur++;
    }
    if (open) buf.push('\\end{' + open + '}');
    return { tex: buf.join('\n'), next: cur };
  }

  var HEADING_CMD = ['section', 'subsection', 'subsubsection', 'paragraph', 'subparagraph', 'subparagraph'];

  /* Markdown → LaTeX 源码。opts.standalone=true 时只产出正文片段，
     否则包装成可直接用 xelatex 编译的完整文档。 */
  function mdToLatex(md, opts) {
    opts = opts || {};
    var warnings = [];
    var lines = String(md == null ? '' : md).replace(/\r\n/g, '\n').split('\n');
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      /* --- 围栏代码块：内容原样进 verbatim，不做任何转义 --- */
      if (/^```([\w+-]*)\s*$/.test(line)) {
        i++;
        var code = [];
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push('\\begin{verbatim}\n' + code.join('\n') + '\n\\end{verbatim}');
        continue;
      }

      /* --- 块级公式 $$...$$ --- */
      if (/^\s*\$\$/.test(line)) {
        var first = line.replace(/^\s*\$\$/, '');
        var buf = [];
        if (/\$\$\s*$/.test(first)) {
          buf.push(first.replace(/\$\$\s*$/, ''));
          i++;
        } else {
          buf.push(first);
          i++;
          while (i < lines.length && !/\$\$\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
          if (i < lines.length) { buf.push(lines[i].replace(/\$\$\s*$/, '')); i++; }
          else warnings.push('块级公式缺少收尾的 $$，已按原文收口');
        }
        out.push('\\[\n' + buf.join('\n').trim() + '\n\\]');
        continue;
      }

      /* --- 标题 --- */
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        out.push('\\' + HEADING_CMD[h[1].length - 1] + '{' + inlineTex(h[2]) + '}');
        i++;
        continue;
      }

      /* --- 分隔线 --- */
      if (/^(---|\*\*\*|___)\s*$/.test(line)) {
        out.push('\\begin{center}\\rule{0.85\\linewidth}{0.4pt}\\end{center}');
        i++;
        continue;
      }

      /* --- 表格 → tabular --- */
      if (line.trim().indexOf('|') >= 0 && i + 1 < lines.length && mdIsDelimRow(lines[i + 1])) {
        var header = mdSplitRow(line);
        var delim = mdSplitRow(lines[i + 1]);
        if (delim.length === header.length) {
          var aligns = delim.map(function (c) {
            if (/^:-+:$/.test(c)) return 'c';
            if (/^-+:$/.test(c)) return 'r';
            return 'l';
          });
          i += 2;
          var rows = [];
          while (i < lines.length && lines[i].trim() && lines[i].trim().indexOf('|') >= 0) {
            if (mdIsDelimRow(lines[i])) { i++; continue; }
            rows.push(mdSplitRow(lines[i]));
            i++;
          }
          var spec = '';
          for (var k = 0; k < header.length; k++) spec += '|' + aligns[k];
          spec += '|';
          var tb = ['\\begin{center}', '\\begin{tabular}{' + spec + '}', '\\hline'];
          tb.push(header.map(function (c) { return '\\textbf{' + inlineTex(c) + '}'; }).join(' & ') + ' \\\\');
          tb.push('\\hline');
          rows.forEach(function (r) {
            var cells = [];
            for (var q = 0; q < header.length; q++) cells.push(inlineTex(r[q] || ''));
            tb.push(cells.join(' & ') + ' \\\\');
            tb.push('\\hline');
          });
          tb.push('\\end{tabular}', '\\end{center}');
          out.push(tb.join('\n'));
          continue;
        }
      }

      /* --- 引用块（内部递归转换，支持嵌套结构） --- */
      if (/^>\s?/.test(line)) {
        var qb = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) { qb.push(lines[i].replace(/^>\s?/, '')); i++; }
        var inner = mdToLatex(qb.join('\n'), { standalone: true });
        inner.warnings.forEach(function (w) { warnings.push(w); });
        out.push('\\begin{quote}\n' + inner.text + '\n\\end{quote}');
        continue;
      }

      /* --- 列表 --- */
      var lm = line.match(MD_LIST_RE);
      if (lm) {
        var items = [];
        while (i < lines.length) {
          var m = lines[i].match(MD_LIST_RE);
          if (!m) break;
          items.push({
            indent: m[1].replace(/\t/g, '    ').length,
            ordered: /^\d/.test(m[2]),
            text: m[3]
          });
          i++;
        }
        out.push(renderListTex(items, 0, items[0].indent).tex);
        continue;
      }

      /* --- 段落 --- */
      var pb = [line];
      i++;
      while (i < lines.length && lines[i].trim()
        && !/^```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])
        && !/^(---|\*\*\*|___)\s*$/.test(lines[i]) && !/^>\s?/.test(lines[i])
        && !/^\s*\$\$/.test(lines[i]) && !MD_LIST_RE.test(lines[i])
        && lines[i].trim().indexOf('|') < 0) {
        pb.push(lines[i]); i++;
      }
      out.push(inlineTex(pb.join(' ')));
    }

    var body = out.join('\n\n');
    if (opts.standalone) return { text: body, warnings: warnings };

    var head = [
      '\\documentclass[11pt]{' + (opts.documentClass || 'ctexart') + '}',
      '\\usepackage[normalem]{ulem}',
      '\\usepackage{amsmath,amssymb,graphicx,hyperref,geometry}',
      '\\geometry{a4paper,margin=2.5cm}',
      opts.title ? '\\title{' + texEscape(opts.title) + '}' : '',
      opts.author ? '\\author{' + texEscape(opts.author) + '}' : '',
      '\\begin{document}',
      opts.title ? '\\maketitle' : ''
    ].filter(function (x) { return x !== ''; }).join('\n');

    return { text: head + '\n\n' + body + '\n\n\\end{document}\n', warnings: warnings };
  }

  /* 调试用：把 AST 摊平成可读文本，便于测试断言 */
  function astToText(tex) {
    function flat(n) {
      if (!n) return '';
      switch (n.type) {
        case 'empty': return '';
        case 'root': case 'group': return n.items.map(flat).join('');
        case 'num': case 'ident': case 'sym': case 'raw': return String(n.v);
        case 'func': return n.v;
        case 'text': return n.v;
        case 'bb': return n.v.split('').map(function (c) { return BLACKBOARD[c] || c; }).join('');
        case 'cal': return n.v.split('').map(function (c) { return CAL[c] || c; }).join('');
        case 'op': return n.chr;
        case 'space': return ' ';
        case 'sup': return flat(n.base) + '^' + flat(n.sup);
        case 'sub': return flat(n.base) + '_' + flat(n.sub);
        case 'subsup': return flat(n.base) + '_' + flat(n.sub) + '^' + flat(n.sup);
        case 'frac': return '(' + flat(n.num) + ')/(' + flat(n.den) + ')';
        case 'binom': return 'C(' + flat(n.num) + ',' + flat(n.den) + ')';
        case 'sqrt': return 'sqrt(' + flat(n.body) + ')';
        case 'nary': return n.chr + (n.sub ? '_' + flat(n.sub) : '') + (n.sup ? '^' + flat(n.sup) : '') + '{' + flat(n.body) + '}';
        case 'delim': return n.open + n.items.map(flat).join('') + n.close;
        case 'matrix': return n.rows.map(function (r) { return '[' + r.map(flat).join('&') + ']'; }).join(';');
        case 'accent': return flat(n.body) + n.chr;
        default: return '';
      }
    }
    return flat(parse(tex));
  }

  /* ==================================================================
     七、文档层：LaTeX → Markdown
     ================================================================== */

  /* 参数匹配：允许一层花括号嵌套，足以覆盖绝大多数真实文档 */
  var ARG = '\\{([^{}]*(?:\\{[^{}]*\\}[^{}]*)*)\\}';

  /* 层级映射必须与 HEADING_CMD 严格对称，否则 md → tex → md 往返会逐次漂移
     （一级标题转过去再转回来就成了二级）。article 类里 \section 就是顶层章节。 */
  var SECTION_MD = {
    chapter: '#', section: '#', subsection: '##',
    subsubsection: '###', paragraph: '####', subparagraph: '#####'
  };

  /* 转换后仍会留在文本里的、不必告警的命令 */
  var BENIGN = {
    noindent: 1, newline: 1, linebreak: 1, par: 1, smallskip: 1, medskip: 1,
    bigskip: 1, hfill: 1, hrule: 1, vspace: 1, hspace: 1, centering: 1,
    makeatletter: 1, makeatother: 1, left: 1, right: 1,
    toprule: 1, midrule: 1, bottomrule: 1, hline: 1, cline: 1,
    documentclass: 1, usepackage: 1, begin: 1, end: 1, item: 1,
    maketitle: 1, tableofcontents: 1, newpage: 1, clearpage: 1, pagebreak: 1,
    label: 1, index: 1, vfill: 1, hfilll: 1, relax: 1
  };

  /* 行内命令 → Markdown 标记。循环到不动点，以便处理嵌套命令。 */
  function latexInline(s, warn) {

      var trPr = isHead ? '<w:trPr><w:tblHeader/></w:trPr>' : '';
      var tr = '<w:tr>' + trPr;
      // 按列数补齐空单元格，避免行单元格数与 tblGrid 不一致导致排版错乱
      for (var j = 0; j < colCount; j++) {
        var cellNode = cells[j];
        if (!cellNode) {
          tr += '<w:tc><w:tcPr><w:tcW w:w="' + gridW + '" w:type="dxa"/></w:tcPr>' + para('') + '</w:tc>';
          continue;
        }
        var head = cellNode.tag === 'th';
        var tcPr = '<w:tcW w:w="' + gridW + '" w:type="dxa"/>'
          + (head ? '<w:shd w:val="clear" w:color="auto" w:fill="F2F4F8"/>' : '');
        tr += '<w:tc><w:tcPr>' + tcPr + '</w:tcPr>'
          + para(runsFromNodes(cellNode.children, head ? { b: true } : {}, ctx),
            '<w:spacing w:before="20" w:after="20" w:line="240" w:lineRule="auto"/>')
          + '</w:tc>';
      }
      tr += '</w:tr>';
      body += tr;
    }

    return '<w:tbl><w:tblPr><w:tblW w:w="' + CONTENT_WIDTH + '" w:type="dxa"/>' + BORDER
      + '</w:tblPr><w:tblGrid>' + grid + '</w:tblGrid>' + body + '</w:tbl>' + para('');
  }

  function collectText(node) {
    var s = '';
    for (var i = 0; i < node.children.length; i++) {
      var c = node.children[i];
      s += c.type === 'text' ? c.text : collectText(c);
    }
    return s;
  }

  function blocks(nodes, ctx) {
    var out = '';
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.type === 'text') {
        if (n.text.trim()) out += para(runXml(n.text.replace(/\s+/g, ' ').trim(), {}));
        continue;
      }
      var tag = n.tag;
      if (/^h[1-6]$/.test(tag)) {
        var lvl = parseInt(tag.charAt(1), 10);
        out += para(runsFromNodes(n.children, {}, ctx), '<w:pStyle w:val="Heading' + lvl + '"/>');
      } else if (tag === 'p') {
        out += para(runsFromNodes(n.children, {}, ctx));
      } else if (tag === 'hr') {
        out += para('', '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="CCCCCC"/></w:pBdr>');
      } else if (tag === 'blockquote') {
        out += quoteXml(n, ctx);
      } else if (tag === 'pre') {
        out += preXml(n, ctx);
      } else if (tag === 'ul' || tag === 'ol') {
        out += listXml(n, ctx.newList(tag === 'ol'), 0, ctx, tag === 'ol');
      } else if (tag === 'table') {
        out += tableXml(n, ctx);
      } else if (tag === 'div' || tag === 'section' || tag === 'body') {
        out += blocks(n.children, ctx);
      } else {
        out += para(runsFromNodes([n], {}, ctx));
      }
    }
    return out;
  }

  /* ---------------- OOXML 固定部件 ---------------- */
  var XML_HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\r\n';

  var CONTENT_TYPES = XML_HEAD
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
    + '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'
    + '</Types>';

  var ROOT_RELS = XML_HEAD
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    + '</Relationships>';

  var HEADING_STYLES = (function () {
    var sizes = [32, 28, 24, 22, 22, 22];
    var before = [280, 240, 200, 180, 160, 160];
    var out = '';
    for (var i = 0; i < 6; i++) {
      out += '<w:style w:type="paragraph" w:styleId="Heading' + (i + 1) + '">'
        + '<w:name w:val="heading ' + (i + 1) + '"/>'
        + '<w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:qFormat/>'
        + '<w:pPr><w:keepNext/><w:keepLines/>'
        + '<w:spacing w:before="' + before[i] + '" w:after="120"/>'
        + '<w:outlineLvl w:val="' + i + '"/></w:pPr>'
        + '<w:rPr><w:b/><w:sz w:val="' + sizes[i] + '"/><w:szCs w:val="' + sizes[i] + '"/>'
        + '<w:color w:val="1F2430"/></w:rPr></w:style>';
    }
    return out;
  })();

  var STYLES = XML_HEAD
    + '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    + '<w:docDefaults>'
    + '<w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="微软雅黑" w:cs="Calibri"/>'
    + '<w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault>'
    + '<w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault>'
    + '</w:docDefaults>'
    + '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>'
    + HEADING_STYLES
    + '</w:styles>';

  /* 0 = 无序（项目符号），1 = 有序（阿拉伯数字）；每个列表单独分配 numId，
     使多个列表各自从 1 开始编号，而不是跨段落连续编号。 */
  function abstractNumsXml() {
    var bullet = '<w:abstractNum w:abstractNumId="0"><w:multiLevelType w:val="hybridMultilevel"/>';
    var decimal = '<w:abstractNum w:abstractNumId="1"><w:multiLevelType w:val="hybridMultilevel"/>';
    for (var i = 0; i < 9; i++) {
      var ind = 420 + i * 420;
      bullet += '<w:lvl w:ilvl="' + i + '"><w:start w:val="1"/><w:numFmt w:val="bullet"/>'
        + '<w:lvlText w:val="•"/><w:lvlJc w:val="left"/>'
        + '<w:pPr><w:ind w:left="' + ind + '" w:hanging="420"/></w:pPr></w:lvl>';
      decimal += '<w:lvl w:ilvl="' + i + '"><w:start w:val="1"/><w:numFmt w:val="decimal"/>'
        + '<w:lvlText w:val="%' + (i + 1) + '."/><w:lvlJc w:val="left"/>'
        + '<w:pPr><w:ind w:left="' + ind + '" w:hanging="420"/></w:pPr></w:lvl>';
    }
    return bullet + '</w:abstractNum>' + decimal + '</w:abstractNum>';
  }

  function numberingXml(nums) {
    var out = XML_HEAD
      + '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
      + abstractNumsXml();
    for (var i = 0; i < nums.length; i++) {
      out += '<w:num w:numId="' + nums[i].numId + '">'
        + '<w:abstractNumId w:val="' + nums[i].abstractId + '"/>'
        + '<w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>';
    }
    return out + '</w:numbering>';
  }

  var SECT_PR = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>'
    + '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="851" w:footer="992" w:gutter="0"/>'
    + '</w:sectPr>';

  /* ---------------- ZIP（仅存储，不压缩） ---------------- */
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    var c = 0xFFFFFFFF;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function utf8(str) {
    if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(str);
    var out = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) out.push(0xC0 | (c >> 6), 0x80 | (c & 63));
      else out.push(0xE0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    }
    return new Uint8Array(out);
  }

  function zip(files) {
    var now = new Date();
    var dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    var dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

    var parts = [];
    var central = [];
    var offset = 0;

    for (var i = 0; i < files.length; i++) {
      var nameBytes = utf8(files[i].name);
      var data = files[i].data;
      var crc = crc32(data);

      var local = new Uint8Array(30 + nameBytes.length);
      var lv = new DataView(local.buffer);
      lv.setUint32(0, 0x04034b50, true);
      lv.setUint16(4, 20, true);
      lv.setUint16(6, 0x0800, true);
      lv.setUint16(8, 0, true);
      lv.setUint16(10, dosTime, true);
      lv.setUint16(12, dosDate, true);
      lv.setUint32(14, crc, true);
      lv.setUint32(18, data.length, true);
      lv.setUint32(22, data.length, true);
      lv.setUint16(26, nameBytes.length, true);
      lv.setUint16(28, 0, true);
      local.set(nameBytes, 30);

      parts.push(local, data);
      central.push({ nameBytes: nameBytes, crc: crc, size: data.length, offset: offset });
      offset += local.length + data.length;
    }

    var cdParts = [];
    var cdSize = 0;
    for (var j = 0; j < central.length; j++) {
      var e = central[j];
      var cd = new Uint8Array(46 + e.nameBytes.length);
      var cv = new DataView(cd.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint16(8, 0x0800, true);
      cv.setUint16(10, 0, true);
      cv.setUint16(12, dosTime, true);
      cv.setUint16(14, dosDate, true);
      cv.setUint32(16, e.crc, true);
      cv.setUint32(20, e.size, true);
      cv.setUint32(24, e.size, true);
      cv.setUint16(28, e.nameBytes.length, true);
      cv.setUint16(30, 0, true);
      cv.setUint16(32, 0, true);
      cv.setUint16(34, 0, true);
      cv.setUint16(36, 0, true);
      cv.setUint32(38, 0, true);
      cv.setUint32(42, e.offset, true);
      cd.set(e.nameBytes, 46);
      cdParts.push(cd);
      cdSize += cd.length;
    }

    var eocd = new Uint8Array(22);
    var ev = new DataView(eocd.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(4, 0, true);
    ev.setUint16(6, 0, true);
    ev.setUint16(8, central.length, true);
    ev.setUint16(10, central.length, true);
    ev.setUint32(12, cdSize, true);
    ev.setUint32(16, offset, true);
    ev.setUint16(20, 0, true);

    var all = parts.concat(cdParts, [eocd]);
    var total = 0;
    for (var m = 0; m < all.length; m++) total += all[m].length;
    var out = new Uint8Array(total);
    var pos = 0;
    for (var q = 0; q < all.length; q++) { out.set(all[q], pos); pos += all[q].length; }
    return out;
  }

  /* ---------------- 组装 .docx ---------------- */
  function build(html) {
    var nodes = parseHtml(String(html || ''));
    var links = [];
    var ctx = {
      nums: [],
      nextNumId: 1,
      newList: function (ordered) {
        var id = this.nextNumId++;
        this.nums.push({ numId: id, abstractId: ordered ? 1 : 0 });
        return id;
      },
      addLink: function (href) {
        var found = -1;
        for (var i = 0; i < links.length; i++) if (links[i] === href) { found = i; break; }
        if (found < 0) { links.push(href); found = links.length - 1; }
        return 100 + found;
      }
    };

    var body = blocks(nodes, ctx);

    var docRels = XML_HEAD
      + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>';
    for (var i = 0; i < links.length; i++) {
      docRels += '<Relationship Id="rId' + (100 + i) + '" '
        + 'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" '
        + 'Target="' + esc(links[i]) + '" TargetMode="External"/>';
    }
    docRels += '</Relationships>';

    var document = XML_HEAD
      + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" '
      + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<w:body>' + (body || para('')) + SECT_PR + '</w:body></w:document>';

    return zip([
      { name: '[Content_Types].xml', data: utf8(CONTENT_TYPES) },
      { name: '_rels/.rels', data: utf8(ROOT_RELS) },
      { name: 'word/document.xml', data: utf8(document) },
      { name: 'word/_rels/document.xml.rels', data: utf8(docRels) },
      { name: 'word/styles.xml', data: utf8(STYLES) },
      { name: 'word/numbering.xml', data: utf8(numberingXml(ctx.nums)) }
    ]);
  }

  function toBase64(bytes) {
    if (typeof Buffer !== 'undefined' && Buffer.from) return Buffer.from(bytes).toString('base64');
    var s = '';
    var CHUNK = 0x8000;
    for (var i = 0; i < bytes.length; i += CHUNK) {
      s += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(s);
  }

  return { build: build, toBase64: toBase64, mime: MIME };
});

/* ============ 应用到预览 ============ */
const input = document.getElementById('input');
const preview = document.getElementById('preview');
const charCount = document.getElementById('charCount');
let currentHtml = '';

function update() {
  const text = input.value;
  charCount.textContent = text.length.toLocaleString('zh-CN') + ' 字符 · ' + (text.trim() ? '已就绪' : '等待输入');
  if (!text.trim()) {
    preview.innerHTML = '';
    return;
  }
  currentHtml = renderMarkdown(text);
  preview.innerHTML = currentHtml;
}
input.addEventListener('input', update);

/* ============ 复制富文本（含格式，仅用于粘贴到 Word 保留样式） ============ */
function wrapWordHtml(inner) {
  // 为 Word 提供内联样式版本，保证粘贴后格式尽量还原
  const withInline = injectInlineCss(inner);
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">'
    + '<head><meta charset="utf-8"><!--[if gte mso 9]>'
    + '<xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->'
    + '<style>body{font-family:Calibri,"Microsoft YaHei","PingFang SC",sans-serif;font-size:11pt;line-height:1.5;color:#1f2430}'
    + 'h1,h2,h3,h4{font-family:"Microsoft YaHei",Calibri,sans-serif;line-height:1.35}'
    + 'h1{font-size:20pt}h2{font-size:16pt}h3{font-size:13.5pt}h4{font-size:12pt}'
    + 'code{font-family:Consolas,"Courier New",monospace;background:#f1f3f7;padding:1px 4px}'
    + 'pre{background:#0f1722;color:#e6edf7;padding:10px 12px;border-radius:4px}'
    + 'blockquote{margin:6pt 0;padding:2pt 10pt;border-left:3pt solid #2f6fed;background:#f4f7ff;color:#4a5568}'
    + 'ul,ol{margin:4pt 0;padding-left:20pt}table{border-collapse:collapse}td,th{border:1pt solid #d3d8e0;padding:3pt 7pt}'
    + 'hr{border:none;border-top:1pt solid #ccc}</style></head><body>' + withInline + '</body></html>';
}

function injectInlineCss(html) {
  // 给块级元素补充小的内联样式，增强 Word 兼容性
  return html
    .replace(/<h([1-4])([^>]*)>/g, '<h$1$2 style="margin-top:10pt;margin-bottom:4pt">')
    .replace(/<strong([^>]*)>/g, '<strong$1 style="font-weight:bold">')
    .replace(/<em([^>]*)>/g, '<em$1 style="font-style:italic">')
    .replace(/<pre([^>]*)>/g, '<pre$1 style="background:#0f1722;color:#e6edf7;padding:8px 10px;' +
      'border-radius:4px;word-break:break-all;white-space:pre-wrap">');
}

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ok ? 'show success' : 'show';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { t.className = ''; }, 2200);
}

/* 现代 API 写入 HTML + 纯文本 */
async function copyWithClipboardApi(html, plain) {
  try {
    const item = new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([plain], { type: 'text/plain' })
    });
    await navigator.clipboard.write([item]);
    return true;
  } catch (e) {
    return false;
  }
}

/* 传统 fallback：利用选区复制富文本 */
function copyWithSelection(html) {
  const holder = document.createElement('div');
  holder.setAttribute('contenteditable', 'true');
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
  holder.innerHTML = html;
  document.body.appendChild(holder);
  const sel = window.getSelection();
  sel.removeAllRanges();
  const range = document.createRange();
  range.selectNodeContents(holder);
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  sel.removeAllRanges();
  document.body.removeChild(holder);
  return ok;
}

function copyRich() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const fullHtml = wrapWordHtml(currentHtml);
  const plain = preview.textContent || text;

  let done = false;
  // 先尝试现代 API（可靠保留 HTML）→ 失败再走选区方式
  if (navigator.clipboard && window.ClipboardItem) {
    copyWithClipboardApi(fullHtml, plain).then(function (ok) {
      if (ok) { showToast('已复制富文本 ✅ 到 Word 直接粘贴（Ctrl+V）即可', true); }
      else if (copyWithSelection(fullHtml)) { showToast('已复制富文本 ✅ 到 Word 直接粘贴即可', true); }
      else { showToast('复制失败，请检查浏览器权限'); }
    });
  } else {
    if (copyWithSelection(fullHtml)) { showToast('已复制富文本 ✅ 到 Word 直接粘贴即可', true); }
    else { showToast('复制失败，请检查浏览器权限'); }
  }
}

function copyPlain() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const plain = preview.textContent || text;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(plain).then(function () {
      showToast('已复制纯文本（无格式）', true);
    }).catch(function () {
      const ta = document.createElement('textarea');
      ta.value = plain; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      showToast('已复制纯文本（无格式）', true);
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = plain; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('已复制纯文本（无格式）', true);
  }
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* 导出 Word 文档：docx 为原生 OOXML 格式；doc 为 HTML 兼容格式，均由浏览器下载 */
function exportWord() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const sel = document.getElementById('exportFormat');
  const fmt = sel ? sel.value : 'docx';
  const defaultName = sanitizeFilename((text.match(/^#{1,6}\s+(.+)$/m) || [, '导出文档'])[1]).slice(0, 40) || '导出文档';

  if (fmt === 'docx') {
    if (!window.docxgen) { showToast('docx 生成模块未加载，请改用 .doc 格式'); return; }
    let bytes;
    try {
      bytes = window.docxgen.build(currentHtml, {
        mathToOmml: window.texconv
          ? function (tex, block) { return block ? window.texconv.mathToOmmlPara(tex) : window.texconv.mathToOmml(tex); }
          : null
      });
    }
    catch (e) { showToast('生成 .docx 失败：' + e.message); return; }
    downloadBlob(new Blob([bytes], { type: window.docxgen.mime }), defaultName + '.docx');
    showToast('Word 文档已下载 ✅（.docx 原生格式）', true);
    return;
  }

  if (fmt === 'tex') {
    if (!window.texconv) { showToast('LaTeX 转换模块未加载'); return; }
    const r = window.texconv.mdToLatex(text, { title: defaultName });
    downloadBlob(new Blob([r.text], { type: 'text/x-tex;charset=utf-8' }), defaultName + '.tex');
    showToast(r.warnings.length
      ? 'LaTeX 源码已下载 ✅（' + r.warnings.length + ' 个命令未识别，已原样保留）'
      : 'LaTeX 源码已下载 ✅', true);
    return;
  }

  const fullHtml = wrapWordHtml(injectInlineCss(currentHtml));
  downloadBlob(new Blob(['\ufeff' + fullHtml], { type: 'application/msword' }), defaultName + '.doc');
  showToast('Word 文档已下载 ✅（.doc 兼容格式）', true);
}

/* ============ LaTeX 导入与文件拖入识别（网页版全部走 File API） ============ */

function applyTex(texText, label) {
  if (!window.texconv) { showToast('LaTeX 转换模块未加载'); return; }
  const r = window.texconv.latexToMd(texText);
  input.value = r.text;
  update();
  const name = label || 'LaTeX';
  if (r.warnings.length) {
    showToast('已从 ' + name + ' 转换；' + r.warnings.length + ' 个命令未识别（已原样保留在文中）', true);
  } else {
    showToast('已从 ' + name + ' 转换为 Markdown ✅', true);
  }
}

function looksLikeLatex(text) {
  return /\\documentclass\b/.test(text)
    || /\\begin\s*\{(document|itemize|enumerate|tabular|equation|align|figure|table|abstract)\}/.test(text)
    || /\\(?:section|subsection|textbf|emph|includegraphics)\s*\{/.test(text);
}

function sniffKind(name, text) {
  const ext = ((name.match(/\.([a-z0-9]+)$/i) || [])[1] || '').toLowerCase();
  if (['tex', 'latex'].indexOf(ext) >= 0) return 'latex';
  if (['md', 'markdown', 'mdx'].indexOf(ext) >= 0) return 'markdown';
  return looksLikeLatex(text) ? 'latex' : 'markdown';
}

function handleDroppedFile(file, text) {
  const kind = sniffKind(file.name, text);
  if (kind === 'latex') {
    applyTex(text, file.name);
  } else {
    input.value = text;
    update();
    showToast('已识别为 Markdown：' + file.name + '（可导出 Word / .doc / .tex）', true);
  }
  preview.scrollTop = 0;
}

function setupDrag() {
  let depth = 0;
  document.addEventListener('dragenter', function (e) {
    e.preventDefault();
    depth++;
    document.body.classList.add('dragging');
  });
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('dragleave', function (e) {
    e.preventDefault();
    if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging'); }
  });
  document.addEventListener('drop', async function (e) {
    e.preventDefault();
    depth = 0;
    document.body.classList.remove('dragging');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!file) return;
    let text = '';
    try { text = await file.text(); } catch (err) { showToast('读取文件失败：' + err.message); return; }
    if (!text.trim()) { showToast('文件是空的'); return; }
    handleDroppedFile(file, text);
  });
}

function pickTexFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.tex,.latex,.txt,.md';
  inp.onchange = async function () {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const text = await f.text();
    handleDroppedFile(f, text);
  };
  inp.click();
}

document.getElementById('btnImportTex').addEventListener('click', pickTexFile);
setupDrag();

document.addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
    e.preventDefault(); copyRich();
  }
});
