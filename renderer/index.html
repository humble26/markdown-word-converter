<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → Word 转换器</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #7a8290;
    --primary: #2f6fed;
    --primary-hover: #1f5bd0;
    --success: #1aa06a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .titlebar {
    height: 40px;
    -webkit-app-region: drag;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 14px;
    font-size: 13px; font-weight: 600; color: var(--muted);
  }
  .titlebar .dot { margin-right: 8px; font-size: 15px; }
  .titlebar .hint { margin-left: auto; font-weight: 400; }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 22px;
    display: flex; align-items: center; gap: 14px;
  }
  header .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #2f6fed, #6f4ff2);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 17px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all .15s;
    font-family: inherit;
  }
  .btn:hover { background: #f0f2f6; }
  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
    padding: 9px 18px;
    font-size: 14px;
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn:active { transform: translateY(1px); }
  select.fmt-select {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  select.fmt-select:focus { outline: none; border-color: var(--primary); }
  main { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; height: calc(100vh - 110px); }
  .pane { padding: 12px 16px; background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
  .pane-left { border-right: 1px solid var(--border); }
  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 2px;
    font-size: 12px; color: var(--muted);
    font-weight: 600; letter-spacing: .3px;
  }
  .pane-head .tip { font-weight: 400; margin-left: auto; }
  textarea {
    flex: 1;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    resize: none;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.7;
    font-family: "Consolas", "Microsoft YaHei", monospace;
    color: var(--text);
    background: #fff;
  }
  textarea:focus { outline: none; border-color: var(--primary); }
  #preview {
    flex: 1;
    padding: 14px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: auto;
    font-size: 14px;
    line-height: 1.75;
    background: #fff;
  }
  #preview h1, #preview h2, #preview h3, #preview h4 { margin: .9em 0 .45em; line-height: 1.35; font-weight: 700; }
  #preview h1 { font-size: 1.55em; }
  #preview h2 { font-size: 1.35em; }
  #preview h3 { font-size: 1.18em; }
  #preview h4 { font-size: 1.05em; }
  #preview p { margin: .5em 0; }
  #preview ul, #preview ol { margin: .5em 0; padding-left: 1.6em; }
  #preview li { margin: .2em 0; }
  #preview blockquote { margin: .6em 0; padding: .3em .9em; border-left: 3px solid var(--primary); background: #f4f7ff; color: #4a5568; border-radius: 0 6px 6px 0; }
  #preview code { background: var(--code-bg, #f1f3f7); padding: .12em .4em; border-radius: 5px; font-family: "Consolas", monospace; font-size: .92em; }
  #preview pre { background: #0f1722; color: #e6edf7; padding: 12px 14px; border-radius: 8px; overflow: auto; }
  #preview pre code { background: none; padding: 0; color: inherit; }
  #preview table { border-collapse: collapse; margin: .7em 0; }
  #preview th, #preview td { border: 1px solid #d3d8e0; padding: 6px 10px; }
  #preview th { background: #f2f4f8; font-weight: 600; }
  #preview img { max-width: 100%; }
  #preview hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  #preview a { color: var(--primary); }

  .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 22px; grid-column: 1 / -1; grid-row: 1; }
  .char-count { font-size: 12px; color: var(--muted); }

  #toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2430; color: #fff; padding: 11px 20px; border-radius: 9px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr 1fr; height: auto; min-height: calc(100vh - 110px); }
    .pane-left { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="titlebar">
  <span class="dot">◆</span> Markdown → Word 转换器
  <span class="hint">AI 回复 → 富文本 → Word</span>
</div>

<header>
  <div class="logo">M↓</div>
  <div>
    <h1>Markdown → Word 转换器</h1>
    <div class="sub">粘贴 AI 的 Markdown 回复，一键转成带格式的富文本粘贴到 Word</div>
  </div>
  <div class="spacer"></div>
  <button class="btn" id="btnExample">插入示例</button>
  <button class="btn" id="btnClear">清空</button>
</header>

<div class="toolbar">
  <button class="btn btn-primary" id="btnCopy">复制富文本（Ctrl+Shift+C）</button>
  <button class="btn" id="btnExportWord">导出 Word 文档</button>
  <select class="fmt-select" id="exportFormat" title="选择导出格式">
    <option value="docx">.docx 原生格式（推荐）</option>
    <option value="doc">.doc 兼容格式</option>
  </select>
  <button class="btn" id="btnCopyPlain">复制纯文本</button>
  <span class="char-count" id="charCount"></span>
</div>

<main>
  <div class="pane pane-left">
    <div class="pane-head">Markdown 输入 <span class="tip">自动实时转换</span></div>
    <textarea id="input" placeholder="在这里粘贴 AI 的 Markdown 回复…"></textarea>
  </div>
  <div class="pane">
    <div class="pane-head">格式预览（Word 中的效果）</div>
    <div id="preview"></div>
  </div>
</main>

<div id="toast"></div>

<script src="docxgen.js"></script>
<script>
"use strict";

/* ============ 一个轻量的自包含 Markdown 解析器（离线可用） ============ */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function decodeHtml(s) {
  return String(s).replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&amp;/g, '&');
}

// 过滤 javascript:/data:/vbscript: 等危险协议，避免自注入与导出到 Word 的风险
function safeUrl(url) {
  const raw = decodeHtml(url).trim();
  if (/^(javascript|data|vbscript):/i.test(raw)) return null;
  return url;
}

// 清洗为合法 Windows 文件名，空结果回落默认名
function sanitizeFilename(name) {
  const clean = String(name || '')
    .replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ')
    .replace(/\s+/g, ' ').trim()
    .replace(/[. ]+$/g, '');
  return clean || '导出文档';
}

function inline(text) {
  let t = escapeHtml(text);
  const inter = [];
  t = t.replace(/`([^`]+)`/g, function (m, c) { inter.push('<code>' + c + '</code>'); return '\u0000' + (inter.length - 1) + '\u0000'; });
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;?([^&]*?)&quot;?)?\)/g, function (m, a, u, title) {
    const safe = safeUrl(u);
    if (safe == null) return '<span title="[图片链接已拦截]">' + (a || '') + '</span>';
    return '<img src="' + safe + '" alt="' + a + '"' + (title ? ' title="' + title + '"' : '') + '>';
  });
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;?([^&]*?)&quot;?)?\)/g, function (m, tx, u, title) {
    const safe = safeUrl(u);
    const label = inline(decodeHtml(tx));
    if (safe == null) return label;
    return '<a href="' + safe + '"' + (title ? ' title="' + title + '"' : '') + '>' + label + '</a>';
  });
  t = t.replace(/\*\*([^*]+)\*\*|__([^_]+)__/g, '<strong>$1$2</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)|\b_([^_]+)_\b/g, function (m, p, a, b) { return (p || '') + '<em>' + (a || b) + '</em>'; });
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\u0000(\d+)\u0000/g, function (m, i) { return inter[i]; });
  return t;
}

/* 表格分隔行（|---|:--:| 或 --- | --- 两种写法都识别） */
function isDelimRow(line) {
  return line.indexOf('-') >= 0 && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(line);
}
function delimCellCount(line) {
  return line.replace(/^\s*\||\|\s*$/g, '').split('|').length;
}

/* 按缩进把连续的列表行还原成嵌套的 ul / ol */
function buildList(items) {
  let html = '';
  const stack = [];
  for (let n = 0; n < items.length; n++) {
    const it = items[n];
    const type = it.ordered ? 'ol' : 'ul';
    while (stack.length && it.indent < stack[stack.length - 1].indent) {
      html += '</li></' + stack.pop().type + '>';
    }
    if (!stack.length || it.indent > stack[stack.length - 1].indent) {
      html += '<' + type + '>';
      stack.push({ type: type, indent: it.indent });
      html += '<li>' + inline(it.text);
    } else {
      const top = stack[stack.length - 1];
      if (top.type !== type) {
        html += '</li></' + top.type + '><' + type + '>';
        top.type = type;
      } else {
        html += '</li>';
      }
      html += '<li>' + inline(it.text);
    }
  }
  while (stack.length) html += '</li></' + stack.pop().type + '>';
  return html;
}

function renderBlocks(lines) {
  const out = [];
  let i = 0;
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim() || line.trim() === '\u200b') { i++; continue; }
    const fence = line.match(/^```([\w+-]*)?\s*$/);
    if (fence) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      out.push('<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>');
      continue;
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>'); i++; continue; }
    if (/^(---|\*\*\*|___)\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (line.trim().indexOf('|') >= 0 && i + 1 < lines.length && isDelimRow(lines[i + 1])) {
      const headerCells = line.replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); });
      // 分隔行列数须与表头一致，否则视为普通段落，避免把含 | 的句子误判为表格
      if (delimCellCount(lines[i + 1]) === headerCells.length) {
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].trim() && lines[i].trim().indexOf('|') >= 0) {
          rows.push(lines[i].replace(/^\s*\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); }));
          i++;
        }
        let html = '<table><thead><tr>';
        headerCells.forEach(function (c) { html += '<th>' + inline(c) + '</th>'; });
        html += '</tr></thead><tbody>';
        rows.forEach(function (r) {
          html += '<tr>';
          for (let k = 0; k < headerCells.length; k++) { html += '<td>' + inline(r[k] || '') + '</td>'; }
          html += '</tr>';
        });
        html += '</tbody></table>';
        out.push(html);
        continue;
      }
    }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, '')); i++; }
      out.push('<blockquote>' + renderBlocks(buf) + '</blockquote>');
      continue;
    }
    const lm = line.match(listRe);
    if (lm) {
      const items = [];
      while (i < lines.length) {
        const m = lines[i].match(listRe);
        if (!m) break;
        items.push({
          indent: m[1].replace(/\t/g, '    ').length,
          ordered: /^\d/.test(m[2]),
          text: m[3]
        });
        i++;
      }
      out.push(buildList(items));
      continue;
    }
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim()
        && !/^```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])
        && !/^(---|\*\*\*|___)\s*$/.test(lines[i]) && !/^>\s?/.test(lines[i])
        && !listRe.test(lines[i]) && lines[i].trim().indexOf('|') < 0) {
      buf.push(lines[i]); i++;
    }
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}

function renderMarkdown(src) {
  if (!src || !src.trim()) return '';
  return renderBlocks(src.replace(/\r\n/g, '\n').split('\n'));
}

/* ============ 应用到预览 ============ */
const input = document.getElementById('input');
const preview = document.getElementById('preview');
const charCount = document.getElementById('charCount');
let currentHtml = '';

function update() {
  const text = input.value;
  charCount.textContent = text.length.toLocaleString('zh-CN') + ' 字符 · ' + (text.trim() ? '已就绪' : '等待输入');
  if (!text.trim()) { preview.innerHTML = ''; return; }
  currentHtml = renderMarkdown(text);
  preview.innerHTML = currentHtml;
}
input.addEventListener('input', update);

/* ============ Word 兼容的富文本包装 ============ */
function wrapWordHtml(inner) {
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">'
    + '<head><meta charset="utf-8"><!--[if gte mso 9]>'
    + '<xml><w:WordDocument><w:View>Print</w:View></w:WordDocument></xml><![endif]-->'
    + '<style>body{font-family:Calibri,"Microsoft YaHei","PingFang SC",sans-serif;font-size:11pt;line-height:1.5;color:#1f2430}'
    + 'h1,h2,h3,h4{font-family:"Microsoft YaHei",Calibri,sans-serif;line-height:1.35}'
    + 'h1{font-size:20pt}h2{font-size:16pt}h3{font-size:13.5pt}h4{font-size:12pt}'
    + 'code{font-family:Consolas,"Courier New",monospace;background:#f1f3f7;padding:1px 4px}'
    + 'pre{background:#0f1722;color:#e6edf7;padding:10px 12px;border-radius:4px}'
    + 'blockquote{margin:6pt 0;padding:2pt 10pt;border-left:3pt solid #2f6fed;background:#f4f7ff;color:#4a5568}'
    + 'ul,ol{margin:4pt 0;padding-left:20pt}table{border-collapse:collapse}td,th{border:1pt solid #d3d8e0;padding:3pt 7pt}'
    + 'hr{border:none;border-top:1pt solid #ccc}</style></head><body>' + inner + '</body></html>';
}

function injectInlineCss(html) {
  return html
    .replace(/<h([1-4])([^>]*)>/g, '<h$1$2 style="margin-top:10pt;margin-bottom:4pt">')
    .replace(/<strong([^>]*)>/g, '<strong$1 style="font-weight:bold">')
    .replace(/<em([^>]*)>/g, '<em$1 style="font-style:italic">')
    .replace(/<pre([^>]*)>/g, '<pre$1 style="background:#0f1722;color:#e6edf7;padding:8px 10px;border-radius:4px;word-break:break-all;white-space:pre-wrap">');
}

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = ok ? 'show success' : 'show';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { t.className = ''; }, 2200);
}

/* 复制富文本：优先走 Electron 原生剪贴板，否则回退到浏览器方案 */
async function copyRich() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const fullHtml = wrapWordHtml(injectInlineCss(currentHtml));
  const plain = preview.textContent || text;

  if (window.desktopAPI && window.desktopAPI.copyRichText) {
    try {
      await window.desktopAPI.copyRichText(fullHtml, plain);
      showToast('已复制富文本 ✅ 到 Word 里 Ctrl+V 粘贴即可', true);
      return;
    } catch (e) { /* 回退 */ }
  }
  copyRichBrowser(fullHtml);
}

async function copyRichBrowser(fullHtml) {
  const plain = preview.textContent || input.value;
  if (navigator.clipboard && window.ClipboardItem) {
    try {
      const item = new ClipboardItem({
        'text/html': new Blob([fullHtml], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' })
      });
      await navigator.clipboard.write([item]);
      showToast('已复制富文本 ✅ 到 Word 里 Ctrl+V 粘贴即可', true);
      return;
    } catch (e) { /* 回退 */ }
  }
  const holder = document.createElement('div');
  holder.setAttribute('contenteditable', 'true');
  holder.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
  holder.innerHTML = fullHtml;
  document.body.appendChild(holder);
  const sel = window.getSelection();
  sel.removeAllRanges();
  const range = document.createRange();
  range.selectNodeContents(holder);
  sel.addRange(range);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  sel.removeAllRanges();
  document.body.removeChild(holder);
  if (ok) showToast('已复制富文本 ✅ 到 Word 里 Ctrl+V 粘贴即可', true);
  else showToast('复制失败，请重试');
}

function copyPlain() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const plain = preview.textContent || text;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(plain).then(function () { showToast('已复制纯文本（无格式）', true); })
      .catch(function () { legacyPlainCopy(plain); });
  } else { legacyPlainCopy(plain); }
}
function legacyPlainCopy(plain) {
  const ta = document.createElement('textarea');
  ta.value = plain; document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); document.body.removeChild(ta);
  showToast('已复制纯文本（无格式）', true);
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* 导出 Word 文档：docx 为原生 OOXML 格式；doc 为 HTML 兼容格式。
   桌面版调用原生保存对话框，网页版用 Blob 下载。 */
async function exportWord() {
  const text = input.value.trim();
  if (!text) { showToast('请先粘贴或输入 Markdown 内容'); return; }
  const sel = document.getElementById('exportFormat');
  const fmt = sel ? sel.value : 'docx';
  const defaultName = sanitizeFilename((text.match(/^#{1,6}\s+(.+)$/m) || [, '导出文档'])[1]).slice(0, 40) || '导出文档';

  if (fmt === 'docx') {
    if (!window.docxgen) { showToast('docx 生成模块未加载，请改用 .doc 格式'); return; }
    let bytes;
    try { bytes = window.docxgen.build(currentHtml); }
    catch (e) { showToast('生成 .docx 失败：' + e.message); return; }

    if (window.desktopAPI && window.desktopAPI.saveDocx) {
      try {
        const res = await window.desktopAPI.saveDocx(defaultName, window.docxgen.toBase64(bytes));
        if (res.saved) showToast('Word 文档已保存 ✅ ' + res.path, true);
        return;
      } catch (e) { /* 回退到浏览器下载 */ }
    }
    downloadBlob(new Blob([bytes], { type: window.docxgen.mime }), defaultName + '.docx');
    showToast('Word 文档已下载 ✅（.docx 原生格式）', true);
    return;
  }

  const fullHtml = wrapWordHtml(injectInlineCss(currentHtml));
  if (window.desktopAPI && window.desktopAPI.saveDoc) {
    try {
      const res = await window.desktopAPI.saveDoc(defaultName, fullHtml);
      if (res.saved) { showToast('Word 文档已保存 ✅ ' + res.path, true); }
      return;
    } catch (e) { /* 回退到浏览器下载 */ }
  }
  downloadBlob(new Blob(['\ufeff' + fullHtml], { type: 'application/msword' }), defaultName + '.doc');
  showToast('Word 文档已下载 ✅（.doc 兼容格式）', true);
}

document.getElementById('btnCopy').addEventListener('click', copyRich);
document.getElementById('btnExportWord').addEventListener('click', exportWord);
document.getElementById('btnCopyPlain').addEventListener('click', copyPlain);
document.getElementById('btnClear').addEventListener('click', function () { input.value = ''; update(); });
document.getElementById('btnExample').addEventListener('click', function () { input.value = SAMPLE; update(); preview.scrollTop = 0; showToast('已插入示例', true); });
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); copyRich(); }
});
